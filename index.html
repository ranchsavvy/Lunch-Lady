<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#d7141b">
<title>Lunch Lady</title>
<style>
  :root{
    --green:#2e7d32; --green-bg:#e8f5e9;
    --yellow:#b8860b; --yellow-bg:#fff8e1;
    --red:#c62828; --red-bg:#fdecea;
    --ink:#1c1c1c; --sub:#5f5f5f; --line:#dcdcdc;
    --card:#ffffff; --bg:#f4f4f2;
    /* logo palette: tractor/lettering red, wagon yellow, LL black */
    --accent:#d7141b; --accent-dark:#a80f15; --wagon:#fcb80b; --ll:#161616;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:16px;}
  #app{max-width:560px;margin:0 auto;padding:12px 12px 90px 12px;}
  h1,h2,h3{margin:0 0 8px 0;}
  h1{font-size:19px;}
  h2{font-size:17px;}
  .topbar{position:sticky;top:0;background:var(--accent);color:#fff;padding:12px 14px;border-bottom:4px solid var(--wagon);
    display:flex;align-items:center;justify-content:space-between;z-index:20;}
  .topbar .title{font-weight:700;font-size:17px;}
  .topbar .sub{font-size:12px;opacity:.85;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:12px;margin-bottom:10px;}
  .subcard{background:#f8f8f6;border:1px solid var(--line);border-radius:8px;
    padding:10px;margin-bottom:8px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--ll);color:#fff;border:none;border-radius:8px;
    padding:12px 16px;font-size:15px;font-weight:600;min-height:46px;cursor:pointer;}
  .btn:active{background:#000;}
  .btn.secondary{background:#fff;color:var(--ll);border:1.5px solid var(--ll);}
  .btn.danger{background:#fff;color:var(--red);border:1.5px solid var(--red);}
  .btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);}
  .btn.block{width:100%;}
  .btn.small{padding:8px 10px;min-height:36px;font-size:13px;}
  .btn[disabled]{opacity:.45;pointer-events:none;}
  label{display:block;font-size:13px;color:var(--sub);margin:8px 0 4px;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;padding:11px 10px;font-size:16px;border:1px solid #bfbfbf;border-radius:8px;
    background:#fff;color:var(--ink);}
  input:focus,select:focus{outline:2px solid var(--accent);}
  .field-row{display:flex;gap:8px;}
  .field-row > div{flex:1;}
  .pillbar{display:flex;gap:8px;margin-bottom:10px;}
  .pill{flex:1;text-align:center;padding:6px 4px;border-radius:8px;font-size:13px;font-weight:600;}
  .pill.pending{background:#eee;color:var(--sub);}
  .pill.done{background:var(--green-bg);color:var(--green);}
  .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;
    letter-spacing:.03em;}
  .badge.pending{background:#e6e6e6;color:#555;}
  .badge.done{background:var(--green-bg);color:var(--green);}
  .muted{color:var(--sub);font-size:13px;}
  .bignum{font-size:22px;font-weight:700;}
  table.load{width:100%;border-collapse:collapse;font-size:14px;}
  table.load th{text-align:left;font-size:11px;color:var(--sub);padding:4px 4px;border-bottom:1px solid var(--line);
    text-transform:uppercase;letter-spacing:.03em;}
  table.load td{padding:7px 4px;border-bottom:1px solid #eee;vertical-align:middle;}
  table.load input[type=number]{padding:9px 4px;font-size:16px;width:100%;min-width:0;}
  table.load td:nth-child(3){width:78px;}
  .cum-target{font-size:22px;font-weight:800;color:var(--ink);margin-top:2px;line-height:1.15;}
  .text-warn{color:var(--red);}
  .variance-tag{display:inline-block;padding:2px 8px;border-radius:12px;font-weight:700;font-size:12px;}
  .v-green{background:var(--green-bg);color:var(--green);}
  .v-yellow{background:var(--yellow-bg);color:var(--yellow);}
  .v-red{background:var(--red-bg);color:var(--red);}
  .v-none{background:#eee;color:#888;}
  .tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;
    border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom);}
  .tabbar button{flex:1;background:none;border:none;padding:9px 2px 8px;font-size:11px;
    color:var(--sub);font-weight:600;cursor:pointer;}
  .tabbar button.active{color:var(--accent);}
  .tabbar button .ic{display:block;font-size:18px;margin-bottom:2px;}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;
    display:flex;align-items:flex-end;justify-content:center;}
  .sheet{background:#fff;border-radius:14px 14px 0 0;padding:16px;width:100%;max-width:560px;
    max-height:88vh;overflow-y:auto;}
  .modal-actions{display:flex;gap:8px;margin-top:14px;}
  .modal-actions .btn{flex:1;}
  .x-close{background:none;border:none;font-size:20px;color:var(--sub);cursor:pointer;padding:4px 8px;}
  .fullscreen{position:fixed;inset:0;background:var(--bg);z-index:35;overflow-y:auto;}
  .fs-header{position:sticky;top:0;background:var(--accent);color:#fff;padding:12px 14px;border-bottom:4px solid var(--wagon);
    display:flex;align-items:center;gap:10px;z-index:5;}
  .fs-header .back{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:2px 6px;}
  .fs-body{padding:12px;padding-bottom:100px;max-width:560px;margin:0 auto;}
  .empty{text-align:center;padding:30px 10px;color:var(--sub);}
  .ing-row{display:flex;align-items:center;gap:8px;margin-bottom:2px;}
  .ing-row select,.ing-row input{flex:2;}
  .ing-row .lbsw{flex:1;}
  .ing-row .updown{display:flex;flex-direction:column;gap:2px;}
  .updown button{background:#eee;border:none;border-radius:5px;width:26px;height:22px;font-size:11px;}
  .link{color:var(--accent-dark);font-weight:600;font-size:14px;cursor:pointer;background:none;border:none;padding:0;}
  .toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#222;color:#fff;
    padding:10px 18px;border-radius:20px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;}
  .toast.show{opacity:1;}
  .checkbox-row{display:flex;align-items:center;gap:6px;}
  hr{border:none;border-top:1px solid var(--line);margin:12px 0;}
  .hist-date{font-weight:700;font-size:14px;margin:14px 0 6px;color:var(--accent-dark);}
  .small-x{background:none;border:none;color:var(--sub);font-size:16px;cursor:pointer;padding:2px 6px;}
  #homeLogo{max-width:560px;margin:0 auto;padding:10px 12px 0 12px;}
  #homeLogo img{display:block;width:100%;height:auto;max-height:84px;object-fit:contain;background:#fff;
    border:1px solid var(--line);border-radius:10px;padding:2px 4px;}
  #homeLogo[hidden]{display:none;}
</style>
</head>
