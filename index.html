function renderHistory(){
  const dates = [...state.feedCalls].sort((a,b)=> b.date.localeCompare(a.date));
  const filt = historyFilter.trim().toLowerCase();
  let anyResults = false;
  const blocks = dates.map(fc=>{
    let loads = fc.loads;
    let fds = fc.fieldDeliveries||[];
    let sms = fc.saltMineral||[];
    let bls = fc.bales||[];
    if(filt){
      loads = loads.filter(l=>{
        const r = rationById(l.rationId);
        const penMatch = (l.pens||[]).some(p=>p.penName.toLowerCase().includes(filt));
        return penMatch || (r && r.name.toLowerCase().includes(filt));
      });
      fds = fds.filter(fd=> (fd.groupName||'').toLowerCase().includes(filt));
      sms = sms.filter(e=> (e.herd||'').toLowerCase().includes(filt) || (e.mineralType||'').toLowerCase().includes(filt));
      bls = bls.filter(b=> (b.herd||'').toLowerCase().includes(filt) || (b.lines||[]).some(l=>(l.type||l.name||'').toLowerCase().includes(filt)));
    }
    if(loads.length===0 && fds.length===0 && sms.length===0 && bls.length===0) return '';
    anyResults = true;
    return `<div class="hist-date">${displayDate(fc.date)}</div>` + bls.map(b=>renderBaleCard(b,true)).join('') + fds.map(fd=>renderFdCard(fd,true)).join('') + sms.map(e=>renderSmCard(e,true)).join('') + loads.map(l=>{
      const ration = rationById(l.rationId);
      const totalHead = (l.pens||[]).reduce((s,p)=>s+(p.headCount||0),0);
      const penNames = (l.pens||[]).map(p=>escapeHtml(p.penName)).join(', ');
      const varTag = l.overallVariancePct!==null ? `<span class="variance-tag ${varianceClass(l.overallVariancePct)}">${l.overallVariancePct>0?'+':''}${fmt(l.overallVariancePct)}%</span>` : '';
      return `<div class="card" data-viewload="${l.id}">
        <div class="row">
          <div>
            <div style="font-weight:700">${penNames}</div>
            <div class="muted">${totalHead} hd total &middot; ${ration?escapeHtml(ration.name):'(deleted)'}</div>
          </div>
          <span class="badge ${l.status==='done'?'done':'pending'}">${l.status==='done'?'Done':'Incomplete'}</span>
        </div>
        <div class="muted" style="margin-top:6px">Target ${fmt(l.totalTargetLbs)} lb &middot; Actual ${l.totalActualLbs!==null?fmt(l.totalActualLbs):'-'} lb ${varTag}</div>
      </div>`;
    }).join('');
  }).join('');

  return `
  <div class="card">
    <input type="text" id="histFilter" placeholder="Filter by pen, ration, herd, or hay type" value="${escapeHtml(historyFilter)}">
  </div>
  <div class="field-row">
    <button class="btn secondary block" id="exportCsvBtn">Export Ingredient Detail (CSV)</button>
    <button class="btn secondary block" id="exportPenCsvBtn">Export Pen Summary (CSV)</button>
  </div>
  <div style="margin-top:10px">
    ${dates.length===0 ? `<div class="empty">No feed calls logged yet.</div>` : (anyResults?blocks:`<div class="empty">No matches.</div>`)}
  </div>`;
}

function exportCsv(){
  const rows = [['Date','Pens','Total Head Count','Ration','Ingredient','Target lb','Actual lb','Variance lb','Variance %','Skipped']];
  const dates = [...state.feedCalls].sort((a,b)=>a.date.localeCompare(b.date));
  dates.forEach(fc=>{
    fc.loads.forEach(l=>{
      const ration = rationById(l.rationId);
      const penNames = (l.pens||[]).map(p=> penShare(p)<1 ? `${p.penName} (${Math.round(penShare(p)*100)}%)` : p.penName).join('; '); // split pen tagged w/ its share, no new columns
      const totalHead = (l.pens||[]).reduce((s,p)=>s+(p.headCount||0),0);
      l.entries.forEach(e=>{
        rows.push([
          fc.date, penNames, totalHead, ration?ration.name:'',
          ingredientName(e.ingredientId), e.targetIncremental,
          e.actualIncremental??'', e.variance??'', e.variancePct??'', e.skipped?'yes':'no'
        ]);
      });
    });
    (fc.fieldDeliveries||[]).forEach(fd=>{
      const t = fdTotals(fd);
      const rationCol = `Field delivery - covers ${fd.daysCovered} day${fd.daysCovered==1?'':'s'}`;
      (fd.lines||[]).forEach(l=>{
        rows.push([fc.date, fd.groupName, fd.headCount, rationCol, fdIngName(l), '', fdLineLbs(l), '', '', 'no']);
      });
      rows.push([fc.date, fd.groupName, fd.headCount, rationCol, '(delivery total)', t.target, t.actual, round1(t.actual-t.target), t.variancePct??'', 'no']);
    });
    // daily-report bale / SM rows minus the Logged By / Load # columns this export doesn't carry
    baleCsvRows(fc).forEach(r=> rows.push([r[0], r[3], r[4], r[5], r[6], r[7], r[8], r[9], r[10], r[11]]));
    smCsvRows(fc).forEach(r=> rows.push([r[0], r[3], r[4], r[5], r[6], r[7], r[8], r[9], r[10], r[11]]));
  });
  downloadCsv(rows, `lunch-lady-feed-history-${todayStr()}.csv`);
}

function exportPenSummaryCsv(){
  const rows = [['Date','Pen','Head Count','Call Adjustment %','Ration','Combined With','Projected Weight lb','Target DMI lb/hd','Est Target lb','Est Actual lb','Est Variance %','Share of Pen Call %']];
  const dates = [...state.feedCalls].sort((a,b)=>a.date.localeCompare(b.date));
  dates.forEach(fc=>{
    fc.loads.forEach(l=>{
      const ration = rationById(l.rationId);
      const breakdown = loadPenBreakdown(l);
      breakdown.forEach(p=>{
        const others = (l.pens||[]).filter(op=>op.id!==p.id).map(op=>op.penName).join('; ');
        rows.push([
          fc.date, p.penName, p.headCount, p.adjustPct||0, ration?ration.name:'',
          others, p.projectedWeightToday??'', p.targetDMIToday??'', p.targetTotal, p.actualTotal??'', p.variancePct??'',
          round1(penShare(p)*100) // <100 = pen was cut across wagon loads; sum its rows for the day
        ]);
      });
    });
  });
  downloadCsv(rows, `lunch-lady-pen-summary-${todayStr()}.csv`);
}

function downloadCsv(rows, filename){
  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  downloadTextFile(csv, filename, 'text/csv');
}
function downloadTextFile(text, filename, mimeType){
  const blob = new Blob([text], {type: mimeType||'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function csvEscape(v){
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}

function wireSettingsEvents(){
  document.getElementById('rsRefreshSettingsBtn')?.addEventListener('click', async e=>{
    e.target.disabled = true; e.target.textContent = 'Refreshing...';
    await refreshRanchSavvy(true);
    const btn = document.getElementById('rsRefreshSettingsBtn');
    if(btn){ btn.disabled = false; btn.textContent = 'Refresh'; }
  });
  document.getElementById('reporterName').onchange = e=>{ state.settings.reporterName = e.target.value; saveState(); };
  document.getElementById('yellowPct').onchange = e=>{ state.settings.yellowPct = Number(e.target.value)||0; saveState(); };
  document.getElementById('redPct').onchange = e=>{ state.settings.redPct = Number(e.target.value)||0; saveState(); };
  document.getElementById('wagonCapacityLb').onchange = e=>{ state.settings.wagonCapacityLb = Math.max(0, Number(e.target.value)||0); saveState(); };
  document.querySelectorAll('[data-renameing]').forEach(inp=>inp.addEventListener('change', e=>{
    const ing = state.ingredients.find(i=>i.id===e.target.dataset.renameing);
    if(ing){ ing.name = e.target.value.trim()||ing.name; saveState(); }
  }));
  document.querySelectorAll('[data-dmpct]').forEach(inp=>inp.addEventListener('change', e=>{
    const ing = state.ingredients.find(i=>i.id===e.target.dataset.dmpct);
    if(ing){
      let v = Number(e.target.value);
      if(!isFinite(v) || v<=0) v = 100;
      if(v>100) v = 100;
      ing.dmPct = round1(v);
      saveState();
    }
  }));
  document.querySelectorAll('[data-delling]').forEach(b=>b.addEventListener('click', e=>{
    const id = e.target.dataset.delling;
    const inUse = state.rations.some(r=>r.items.some(it=>it.ingredientId===id));
    if(inUse){ showToast('Remove it from rations first'); return; }
    confirmAction('Delete this ingredient?', ()=>{
      state.ingredients = state.ingredients.filter(i=>i.id!==id);
      saveState(); render();
    });
  }));
  document.getElementById('addIngBtn').onclick = ()=>{
    const name = prompt('New ingredient name:');
    if(name && name.trim()){
      state.ingredients.push({id:uid(), name:name.trim(), dmPct:guessDmPct(name.trim())});
      saveState(); render();
    }
  };
  document.getElementById('exportJsonBtn').onclick = ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `lunch-lady-backup-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };
  document.getElementById('importJsonFile').onchange = e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed.ingredients || !parsed.rations || !parsed.feedCalls) throw new Error('bad format');
        confirmAction('Replace all current data with this backup?', ()=>{
          state = parsed;
          migrateState();
          saveState(); showToast('Backup restored'); render();
        });
      }catch(err){ showToast('Could not read that file'); }
    };
    reader.readAsText(file);
  };
  document.getElementById('clearAllBtn').onclick = ()=>{
    confirmAction('This deletes ALL ingredients, rations, pens, and history on this phone. Export a backup first if unsure. Continue?', ()=>{
      state = defaultState();
      saveState(); showToast('All data cleared'); render();
    });
  };
}

function confirmAction(message, onConfirm){
  const html = `
  <div class="overlay" id="confirmOverlay">
    <div class="sheet">
      <p>${escapeHtml(message)}</p>
      <div class="modal-actions">
        <button class="btn ghost" id="confirmCancel">Cancel</button>

      </div>

  document.body.insertAdjacentHTML('beforeend', html);

function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------------- migration + init ---------------- */
// v1 -> v2: single-pen loads became combined loads with a pens[] array.
// v2 -> v3: ingredients gained DM%, a persistent pen roster was added, and
// ration items (previously as-fed) became DM-basis. To keep every existing
// ration behaving EXACTLY as before the moment this update lands, each
// ration item is converted using the freshly-seeded DM% so that dividing
// back through (DM / DM%) reconstructs the identical as-fed number as
// pre-update. Nothing about today's targets changes on its own -- it only
// changes once you deliberately correct an ingredient's DM% or put a pen
// on %BW/flat-DM targeting.
// v3 -> v4: ration items switched from an absolute lb DM/hd/day amount to
// a % of the total mix (as-fed basis), plus a single referenceTotalAsFed
// (lb as-fed/hd/day) on the ration itself. Each item's old DM amount is
// converted back to as-fed via its ingredient's DM%, summed to get the
// reference total, then expressed as a % share of that total -- this
// reconstructs the exact same mix and the exact same targets as pre-update.
function migrateState(){
  state.feedCalls = state.feedCalls || [];
  state.pens = state.pens || [];
  state.rations = state.rations || [];
  state.settings = state.settings || {};
  // Aug 2026 additions -- purely additive, so plain defaults (no version
  // guard needed; guards below are only for shape TRANSFORMATIONS)
  state.groups = state.groups || [];
  state.ranchSavvy = state.ranchSavvy || {herds:[], fetchedAt:null};
  state.pens.forEach(p=>{ if(p.rsHerdId===undefined) p.rsHerdId = null; });
  state.groups.forEach(g=>{
    if(g.rsHerdId===undefined) g.rsHerdId = null;
    if(g.archived===undefined) g.archived = false;
    if(g.notes===undefined) g.notes = '';
  });
  if(state.settings.yellowPct===undefined) state.settings.yellowPct = 3;
  if(state.settings.redPct===undefined) state.settings.redPct = 6;
  if(state.settings.reporterName===undefined) state.settings.reporterName = '';
  if(state.settings.wagonCapacityLb===undefined) state.settings.wagonCapacityLb = 0; // 0 = not set, no capacity checks
  delete state.settings.writePassphrase; // leftover from a briefly-shipped cloud-sync build
  delete state.settings.smForm; // leftover from the dropped Google Form posting

  state.feedCalls.forEach(fc=>{
    if(!fc.loads && fc.pens){
      fc.loads = fc.pens.map(p=>({
        id: p.id, date: fc.date,
        rationId: p.rationId,
        startingWeight: p.startingWeight||0,
        pens: [{id:uid(), rosterId:null, penName:p.penName, headCount:p.headCount, adjustPct:p.adjustPct||0,
                 anchorWeight:null, anchorDate:null, adg:0, intakeMode:'rationAsIs', intakeValue:0}],
        entries: p.entries||[],
        status: p.status,
        totalTargetLbs: p.totalTargetLbs,
        totalActualLbs: p.totalActualLbs,
        overallVariancePct: p.overallVariancePct,
        completedAt: p.completedAt
      }));
      delete fc.pens;
    }
    if(!fc.loads) fc.loads = [];
    if(!fc.fieldDeliveries) fc.fieldDeliveries = [];
    if(!fc.bales) fc.bales = []; // Nov 2026: bales replace new field deliveries (old ones stay readable)
    fc.bales.forEach(b=>{ if(!b.date) b.date = fc.date; });
    // Oct 2026: salt & mineral entries -- additive
    if(!fc.saltMineral) fc.saltMineral = [];
    fc.saltMineral.forEach(e=>{
      if(!e.date) e.date = fc.date;
      // Nov 2026: Google Sheet posting dropped -- clear its leftover fields
      delete e.sheetStatus; delete e.sheetSentAt; delete e.sheetTries;
    });
    fc.loads.forEach(load=>{
      if(!load.date) load.date = fc.date;
      if(!load.pens) load.pens = [];
      load.pens.forEach(p=>{
        if(p.intakeMode===undefined){ p.intakeMode='rationAsIs'; p.intakeValue=0; p.anchorWeight=null; p.anchorDate=null; p.adg=0; }
        if(p.rosterId===undefined) p.rosterId=null;
      });
    });
  });

  state.ingredients.forEach(ing=>{
    if(ing.dmPct===undefined || ing.dmPct===null) ing.dmPct = guessDmPct(ing.name);
  });

  const fromVersion = state.version||1; // capture BEFORE any step mutates it -- each guard below must see the ORIGINAL version, never an intermediate one

  if(fromVersion < 3){
    state.rations.forEach(r=>{
      r.items.forEach(it=>{
        const ing = state.ingredients.find(i=>i.id===it.ingredientId);
        const dmPct = ing ? ing.dmPct : 100;
        it.lbsPerHeadDay = round1(it.lbsPerHeadDay * (dmPct/100));
      });
    });
  }

  if(fromVersion < 4){
    state.rations.forEach(r=>{
      const asFedList = r.items.map(it=>{
        const ing = state.ingredients.find(i=>i.id===it.ingredientId);
        const dmPct = ing ? ing.dmPct : 100;
        return dmPct>0 ? (it.lbsPerHeadDay||0)/(dmPct/100) : (it.lbsPerHeadDay||0);
      });
      const totalAsFed = asFedList.reduce((s,v)=>s+v,0);
      r.items = r.items.map((it,idx)=>({
        ingredientId: it.ingredientId,
        pctAsFed: totalAsFed>0 ? round1(asFedList[idx]/totalAsFed*100) : round1(100/(r.items.length||1))
      }));
      r.referenceTotalAsFed = round1(totalAsFed);
    });
  }
  state.version = 4;

  // Existing entries keep their historically-recorded targets; only refresh
  // derived totals/status. Only truly-empty loads get a fresh buildTargets.
  state.feedCalls.forEach(fc=>{
    fc.loads.forEach(load=>{
      if(!load.entries || load.entries.length===0) buildTargets(load);
      else recomputeActuals(load);
    });
  });
}
