<script>
/* ---------------- storage ---------------- */
const STORAGE_KEY = 'lunchlady_v1';

/* ---------------- Ranch Savvy link (read-only) ---------------- */
// Optional one-way pull of herd names + head counts from the Ranch Savvy
// cattle inventory (Supabase). Fill in RS_ANON_KEY and RS_APP_KEY below to
// turn it on -- leave them '' and the feature stays completely hidden and
// the app behaves exactly as before. The pull is CACHED (on app open, on
// return-to-foreground when stale, or a manual Refresh tap) -- never a live
// dependency. Ranch Savvy being unreachable costs nothing but a stale
// count; every screen keeps working off the last saved numbers. Nothing is
// ever written back: Ranch Savvy stays the system of record for cattle,
// this app only reads.
// Server side: see ranch-savvy-sync.sql in the repo -- one SECURITY DEFINER
// function, get_herd_summary(), returning {herd_id, name, active_count}
// per active herd, gated by the x-feedwagon-key request header.
const RS_URL      = 'https://tthhlfuqsomgulasjszv.supabase.co';
const RS_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0aGhsZnVxc29tZ3VsYXNqc3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExODM4MjksImV4cCI6MjA4Njc1OTgyOX0.gI_88rFGPbkFgdZccBmcq4LfRJPl-_UuU4JLCI1kvG8'; // Supabase anon key (public by design; RLS still guards everything else)
const RS_APP_KEY  = 'k9Trx2mWq8vBn4Lp7cYd3fHs6jZa'; // must match the key hardcoded inside get_herd_summary()

function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2);
}

/* ---------------- dry matter reference table ---------------- */
// Typical textbook DM% for common feedstuffs -- used only to pre-fill a
// starting point when an ingredient is created. These are generic averages,
// NOT lab results. Correct them (Settings tab) to real numbers whenever you
// have a feed test or known moisture, especially for silage/wet ingredients
// where the difference between a guess and reality is large.
const DM_GUESS_TABLE = [
  [/wet\s*distill|wdgs|wet\s*ddg/i, 35],
  [/distill|ddgs|\bdgs\b/i, 90],
  [/corn\s*silage/i, 35],
  [/silage/i, 35],
  [/grass\s*hay|prairie\s*hay|meadow\s*hay/i, 88],
  [/alfalfa/i, 88],
  [/\bhay\b/i, 88],
  [/straw/i, 90],
  [/\bcorn\b/i, 87],
  [/wheat/i, 88],
  [/oats?/i, 89],
  [/barley/i, 88],
  [/\brye\b/i, 88],
  [/sunflower/i, 92],
  [/soybean\s*meal/i, 89],
  [/soybean\s*hulls?/i, 91],
  [/soybeans?/i, 90],
  [/cottonseed\s*hulls?/i, 90],
  [/gluten\s*feed/i, 90],
  [/mineral/i, 95],
  [/supplement|tub|block/i, 90],
  [/flax/i, 90],
  [/cover\s*crop/i, 30]
];
function guessDmPct(name){
  const n = name||'';
  for(const [re, pct] of DM_GUESS_TABLE){ if(re.test(n)) return pct; }
  return 100;
}

function defaultState(){
  const groundHay = {id: uid(), name:'Ground Hay', dmPct: guessDmPct('Ground Hay')};
  const silage = {id: uid(), name:'Silage', dmPct: guessDmPct('Silage')};
  const ddgs = {id: uid(), name:'DDGS', dmPct: guessDmPct('DDGS')};
  const oats = {id: uid(), name:'Oats', dmPct: guessDmPct('Oats')};
  const corn = {id: uid(), name:'Corn', dmPct: guessDmPct('Corn')};
  const flax = {id: uid(), name:'Flax screenings', dmPct: guessDmPct('Flax screenings')};
  const r1800 = {id: uid(), name:'R1800', dmPct: 90}; // placeholder -- replace with the product's actual DM%
  return {
    version:4,
    settings:{ yellowPct:3, redPct:6, reporterName:'' },
    ingredients:[groundHay, silage, ddgs, oats, corn, flax, r1800],
    rations:[{
      id:uid(), name:'EXAMPLE - Backgrounding Ration (edit or delete me)',
      referenceTotalAsFed: 48.4,
      items:[
        {ingredientId:silage.id, pctAsFed:82.6},
        {ingredientId:ddgs.id, pctAsFed:9.2},
        {ingredientId:groundHay.id, pctAsFed:7.0},
        {ingredientId:r1800.id, pctAsFed:1.2}
      ]
    }],
    pens: [],
    groups: [],
    ranchSavvy: {herds: [], fetchedAt: null},
    feedCalls:[]
  };
}

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.ingredients) return parsed;
    }
  }catch(e){ console.warn('load failed', e); }
  return defaultState();
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ showToast('Save failed - storage full or blocked'); }
}

/* ---------------- helpers ---------------- */
function round1(n){ return Math.round((n+Number.EPSILON)*10)/10; }
function fmt(n){ if(n===null||n===undefined||isNaN(n)) return '-'; return round1(n).toLocaleString(); }
function todayStr(){
  const d = new Date();
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function displayDate(dstr){
  const [y,m,d]=dstr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric', year:'numeric'});
}
function ingredientName(id){
  const ing = state.ingredients.find(i=>i.id===id);
  return ing ? ing.name : '(deleted ingredient)';
}
function ingredientDmPct(id){
  const ing = state.ingredients.find(i=>i.id===id);
  return (ing && ing.dmPct!=null) ? ing.dmPct : 100;
}
function rationById(id){ return state.rations.find(r=>r.id===id); }
function groupById(id){ return (state.groups||[]).find(g=>g.id===id); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------------- daily report (local file / mailto -- no hosting, no accounts) ---------------- */
// A day's "report" bundles every load logged that day plus a free-text
// comments box, and leaves this phone two ways: a Save-to-Drive share (or a
// plain file download if the native share sheet isn't available) and an
// emailed draft. Both are manual, deliberate taps -- there's no server to
// silently retry through, so fc.reportDriveAt / fc.reportEmailAt are just a
// local checklist ("did I already do this today"), not a delivery receipt.
// Since multiple phones each keep their own separate local data, whichever
// phone generates the report is the one whose name (Settings tab) appears
// in it -- that's the attribution, no shared backend needed for it.
function reporterName(){
  return (state.settings.reporterName||'').trim() || '(name not set - Settings tab)';
}
function feedCallHasContent(fc){
  return !!(fc && ((fc.loads && fc.loads.length>0) || (fc.fieldDeliveries && fc.fieldDeliveries.length>0)));
}
function pendingReportDates(){
  const today = todayStr();
  return state.feedCalls
    .filter(fc=> fc.date < today && feedCallHasContent(fc) && (!fc.reportDriveAt || !fc.reportEmailAt))
    .map(fc=>fc.date)
    .sort();
}

function buildDailyReportText(fc){
  const lines = [];
  lines.push(`Feed report - ${displayDate(fc.date)}`);
  lines.push(`Logged by: ${reporterName()}`);
  lines.push('');
  fc.loads.forEach((l,i)=>{
    const ration = rationById(l.rationId);
    const rationLabel = l.rationName || (ration ? ration.name : '(ration deleted)');
    const penNames = (l.pens||[]).map(p=>`${p.penName} (${p.headCount})`).join(', ');
    const totalHead = (l.pens||[]).reduce((s,p)=>s+(p.headCount||0),0);
    lines.push(`Load ${i+1}: ${penNames} - ${totalHead} hd total - ${rationLabel} [${l.status==='done'?'Done':(l.status==='in-progress'?'In Progress':'Pending')}]`);
    (l.entries||[]).forEach(e=>{
      const name = e.ingredientName || ingredientName(e.ingredientId);
      if(e.skipped){
        lines.push(`  ${name}: skipped`);
      } else {
        const actual = e.actualIncremental!=null ? `${fmt(e.actualIncremental)} lb` : 'not entered';
        const varPct = e.variancePct!=null ? ` (${e.variancePct>0?'+':''}${fmt(e.variancePct)}%)` : '';
        lines.push(`  ${name}: target ${fmt(e.targetIncremental)} lb / actual ${actual}${varPct}`);
      }
    });
    lines.push(`  Load total: target ${fmt(l.totalTargetLbs)} lb / actual ${l.totalActualLbs!=null?fmt(l.totalActualLbs):'-'} lb`);
    lines.push('');
  });
  const fds = fc.fieldDeliveries||[];
  fds.forEach((fd,i)=>{
    const t = fdTotals(fd);
    lines.push(`Field delivery ${i+1}: ${fd.groupName} - ${fd.headCount} hd - covers ${fd.daysCovered} day${fd.daysCovered==1?'':'s'}`);
    (fd.lines||[]).forEach(l=>{
      if(l.mode==='count'){
        lines.push(`  ${fdIngName(l)}: ${fmt(l.count)} x ${fmt(l.unitWeight)} lb = ${fmt(fdLineLbs(l))} lb`);
      } else {
        lines.push(`  ${fdIngName(l)}: ${fmt(fdLineLbs(l))} lb (estimated)`);
      }
    });
    lines.push(`  Delivered ${fmt(t.actual)} lb / target ${fmt(t.target)} lb${t.variancePct!==null?` (${t.variancePct>0?'+':''}${fmt(t.variancePct)}%)`:''}`);
    if(t.perHdDay!==null) lines.push(`  = ${fmt(t.perHdDay)} lb/hd/day vs target rate ${fmt(fd.targetRate)}`);
    lines.push('');
  });
  const dayTarget = fc.loads.reduce((s,l)=>s+(l.totalTargetLbs||0),0);
  const anyDayActual = fc.loads.some(l=>l.totalActualLbs!=null);
  const dayActual = fc.loads.reduce((s,l)=> l.totalActualLbs!=null ? s+l.totalActualLbs : s, 0);
  // mixer totals and field-delivery totals stay SEPARATE on purpose: a
  // 4-day bale drop lumped into one day's mixer total would misstate both.
  const mixerLabel = fds.length ? 'Mixer total' : 'Day total';
  if(fc.loads.length){
    lines.push(`${mixerLabel} target: ${fmt(dayTarget)} lb`);
    lines.push(`${mixerLabel} actual: ${anyDayActual?fmt(dayActual):'-'} lb`);
  }
  if(fds.length){
    const fdDelivered = fds.reduce((s,fd)=>s+fdTotals(fd).actual,0);
    lines.push(`Field deliveries total: ${fmt(fdDelivered)} lb delivered (targets judged per delivery over the days each covers)`);
  }
  lines.push('');
  lines.push('--- Comments ---');
  lines.push((fc.comments||'').trim() || '(none)');
  return lines.join('\n');
}

function buildDailyReportCsv(fc){
  const rows = [['Date','Logged By','Load #','Pens','Total Head','Ration','Ingredient','Target lb','Actual lb','Variance lb','Variance %','Skipped']];
  fc.loads.forEach((l,i)=>{
    const ration = rationById(l.rationId);
    const rationName = l.rationName || (ration ? ration.name : '');
    const penNames = (l.pens||[]).map(p=>p.penName).join('; ');
    const totalHead = (l.pens||[]).reduce((s,p)=>s+(p.headCount||0),0);
    (l.entries||[]).forEach(e=>{
      rows.push([
        fc.date, reporterName(), i+1, penNames, totalHead, rationName,
        e.ingredientName || ingredientName(e.ingredientId), e.targetIncremental,
        e.actualIncremental??'', e.variance??'', e.variancePct??'', e.skipped?'yes':'no'
      ]);
    });
  });
  // Field deliveries ride in the SAME columns (no schema change to the
  // accumulating daily CSVs): Load # is 'FD1', 'FD2'...; Pens carries the
  // group name; Ration carries the coverage window. Targets only exist at
  // the delivery level (no per-ingredient recipe), so ingredient rows show
  // actual lbs only and a '(delivery total)' row carries target/variance.
  (fc.fieldDeliveries||[]).forEach((fd,i)=>{
    const t = fdTotals(fd);
    const rationCol = `Field delivery - covers ${fd.daysCovered} day${fd.daysCovered==1?'':'s'}`;
    (fd.lines||[]).forEach(l=>{
      rows.push([
        fc.date, reporterName(), 'FD'+(i+1), fd.groupName, fd.headCount, rationCol,
        fdIngName(l), '', fdLineLbs(l), '', '', 'no'
      ]);
    });
    rows.push([
      fc.date, reporterName(), 'FD'+(i+1), fd.groupName, fd.headCount, rationCol,
      '(delivery total)', t.target, t.actual, round1(t.actual-t.target), t.variancePct??'', 'no'
    ]);
  });
  rows.push([]);
  rows.push(['Comments', (fc.comments||'').trim() || '(none)']);
  return rows.map(r=>r.map(csvEscape).join(',')).join('\n');
}

async function shareReportToDrive(fc){
  const csv = buildDailyReportCsv(fc);
  const filename = `feed-report-${fc.date}.csv`;
  const file = new File([csv], filename, {type:'text/csv'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:`Feed report ${fc.date}`});
      fc.reportDriveAt = new Date().toISOString();
      saveState();
      showToast('Shared - pick Drive to save it there');
      render();
      return;
    }catch(e){
      if(e && e.name==='AbortError') return; // person cancelled the share sheet -- not a failure, don't mark or nag
      // fall through to plain download below
    }
  }
  downloadTextFile(csv, filename, 'text/csv'); // csv is already a fully-formed, escaped string -- write it as-is
  fc.reportDriveAt = new Date().toISOString();
  saveState();
  showToast('Downloaded - upload it to Drive from your Files app');
  render();
}

function emailReport(fc){
  let text = buildDailyReportText(fc);
  const MAX = 1800; // mailto body length is unreliable much past this across mail apps
  if(text.length > MAX) text = text.slice(0, MAX) + '\n\n[report truncated for email -- full detail in the Drive copy]';
  const subject = `Feed report - ${fc.date}`;
  window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;
  fc.reportEmailAt = new Date().toISOString();
  saveState();
  render();
}

/* variance color */
function varianceClass(pct){
  if(pct===null||pct===undefined) return 'v-none';
  const a = Math.abs(pct);
  if(a<=state.settings.yellowPct) return 'v-green';
  if(a<=state.settings.redPct) return 'v-yellow';
  return 'v-red';
}

/* ---------------- Ranch Savvy sync (read-only, cached) ---------------- */
// One-way head-count pull. Pens and Groups can each optionally link to a
// Ranch Savvy herd (rsHerdId); every successful pull pushes the herd's
// live active-animal count into the linked roster entry. Links whose herd
// stops coming back (deactivated / sold out in Ranch Savvy) keep their
// last-known count -- flagged on the roster card, never zeroed. Load math
// needs no special handling: loads already read head counts from the live
// roster at build time.
function ranchSavvyConfigured(){ return !!(RS_URL && RS_ANON_KEY); }
function rsHerds(){ return (state.ranchSavvy && state.ranchSavvy.herds) || []; }
function rsHerdById(id){ return rsHerds().find(h=>h.herd_id===id) || null; }
function rsLinkBroken(entry){
  // only call it broken when we HAVE a successful pull to judge against
  return !!(entry.rsHerdId && state.ranchSavvy && state.ranchSavvy.fetchedAt && !rsHerdById(entry.rsHerdId));
}
function rsFetchedAtLabel(){
  const at = state.ranchSavvy && state.ranchSavvy.fetchedAt;
  if(!at) return 'never';
  const d = new Date(at);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '
       + d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
}
function rsStaleMs(){
  const at = state.ranchSavvy && state.ranchSavvy.fetchedAt;
  if(!at) return Infinity;
  return Date.now() - new Date(at).getTime();
}
async function fetchRanchSavvyHerds(){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 8000);
  try{
    const res = await fetch(RS_URL + '/rest/v1/rpc/get_herd_summary', {
      method: 'POST',
      headers: {
        'apikey': RS_ANON_KEY,
        'Authorization': 'Bearer ' + RS_ANON_KEY,
        'x-feedwagon-key': RS_APP_KEY,
        'Content-Type': 'application/json'
      },
      body: '{}',
      signal: ctrl.signal
    });
    if(!res.ok) return {ok:false, error:'HTTP '+res.status};
    const rows = await res.json();
    if(!Array.isArray(rows)) return {ok:false, error:'unexpected response'};
    const herds = rows.map(r=>({
      herd_id: String(r.herd_id),
      name: String(r.name||''),
      active_count: Number(r.active_count)||0
    }));
    state.ranchSavvy = {herds, fetchedAt: new Date().toISOString()};
    applyRanchSavvyCounts();
    saveState();
    return {ok:true};
  }catch(e){
    return {ok:false, error: (e && e.name==='AbortError') ? 'timed out' : 'network unavailable'};
  }finally{ clearTimeout(timer); }
}
function applyRanchSavvyCounts(){
  state.pens.forEach(p=>{
    if(!p.rsHerdId) return;
    const h = rsHerdById(p.rsHerdId);
    if(h) p.headCount = h.active_count;
  });
  (state.groups||[]).forEach(g=>{
    if(!g.rsHerdId) return;
    const h = rsHerdById(g.rsHerdId);
    if(h) g.headCount = h.active_count;
  });
}
function anyEditorOpen(){
  return !!(openLoadId || openRationId || openPenEditId || openGroupEditId
            || document.getElementById('overlay'));
}
async function refreshRanchSavvy(manual){
  if(!ranchSavvyConfigured()) return;
  const r = await fetchRanchSavvyHerds();
  if(manual){
    showToast(r.ok ? 'Ranch Savvy counts updated'
                   : 'Sync failed ('+r.error+') - using last saved counts');
  }
  // never repaint underneath someone mid-entry; the fresh numbers are
  // saved and show up on the next natural render either way
  if(r.ok && !anyEditorOpen()) render();
}
function rsLinkSelectHtml(selectId, currentRsHerdId){
  const opts = rsHerds().map(h=>
    `<option value="${h.herd_id}" ${h.herd_id===currentRsHerdId?'selected':''}>${escapeHtml(h.name)} (${h.active_count} hd)</option>`
  ).join('');
  const orphan = (currentRsHerdId && !rsHerdById(currentRsHerdId))
    ? `<option value="${escapeHtml(currentRsHerdId)}" selected>(linked herd not in last pull)</option>` : '';
  return `<select id="${selectId}">
    <option value="">Not linked - head count entered by hand</option>
    ${orphan}${opts}
  </select>`;
}

/* ---------------- pen weight / intake projection ---------------- */
// A roster pen (or a load's snapshot of one) carries: anchorWeight (lb/hd
// as of anchorDate), adg (lb/hd/day), and an intake target expressed either
// as %BW (auto-grows with projected weight) or a flat lb DM/hd/day number.
// All numeric reads are defensively coerced with Number() because draft
// objects mid-edit hold raw string values from input fields.
function daysBetween(dateA, dateB){
  const [ay,am,ad] = dateA.split('-').map(Number);
  const [by,bm,bd] = dateB.split('-').map(Number);
  const a = Date.UTC(ay,am-1,ad), b = Date.UTC(by,bm-1,bd);
  return Math.round((b-a)/86400000);
}
function projectedWeight(pen, dateStr){
  const anchorWeight = Number(pen.anchorWeight)||0;
  const adg = Number(pen.adg)||0;
  if(!pen.anchorDate) return round1(anchorWeight);
  const days = daysBetween(pen.anchorDate, dateStr);
  return round1(anchorWeight + adg*days);
}
function targetDMIPerHead(pen, dateStr){
  const intakeValue = Number(pen.intakeValue)||0;
  if(pen.intakeMode==='flatDM') return round1(intakeValue);
  if(pen.intakeMode==='pctBW') return round1(projectedWeight(pen,dateStr) * intakeValue/100);
  return null; // 'rationAsIs' -- no DM targeting, ration's own numbers are used directly
}

/* ---------------- load math ---------------- */
// A "load" is one mixer batch. It can cover more than one pen (combined
// because they share a ration) -- load.pens is an array of pen entries.
// Ration items are now a RECIPE: each ingredient is a % of the total mix,
// as-fed basis (should sum to ~100%, but math below normalizes by whatever
// the percentages actually add up to, so a slightly-off total still works).
// rationWeightedDmFraction() gives the mix's blended DM fraction (0-1),
// derived from each ingredient's % share and its own DM%. For a pen with a
// DM intake target (flat or %BW-of-projected-weight), that blended fraction
// converts the pen's target lb DM/hd/day into a total lb AS-FED/hd/day for
// the whole mix, which is then split across ingredients by their % share.
// A pen using 'rationAsIs' skips DM targeting entirely and instead scales
// off the ration's own referenceTotalAsFed (lb as-fed/hd/day) -- the one
// absolute number a recipe-style ration carries, needed because % alone
// has no scale.
function rationWeightedDmFraction(ration){
  const items = ration ? (ration.items||[]) : [];
  const totalPct = items.reduce((s,it)=>s+(Number(it.pctAsFed)||0),0);
  if(totalPct<=0) return 1;
  let dmWeighted = 0;
  items.forEach(it=>{
    const dmPct = ingredientDmPct(it.ingredientId);
    dmWeighted += (Number(it.pctAsFed)||0) * (dmPct/100);
  });
  return dmWeighted/totalPct;
}
function buildTargets(load){
  const ration = rationById(load.rationId);
  const items = ration ? (ration.items||[]) : [];
  const totalPct = items.reduce((s,it)=>s+(Number(it.pctAsFed)||0),0);
  const dmFraction = rationWeightedDmFraction(ration);
  const referenceTotalAsFed = ration ? (Number(ration.referenceTotalAsFed)||0) : 0;
  const existingByIng = {};
  (load.entries||[]).forEach(e=>existingByIng[e.ingredientId]=e);
  const newEntries = items.map(it=>{
    const pctFrac = totalPct>0 ? (Number(it.pctAsFed)||0)/totalPct : 0;
    const targetIncremental = round1((load.pens||[]).reduce((sum,p)=>{
      const mult = 1 + ((p.adjustPct||0)/100);
      let totalAsFedForPen;
      if(!p.intakeMode || p.intakeMode==='rationAsIs'){
        totalAsFedForPen = referenceTotalAsFed * (p.headCount||0) * mult;
      } else {
        const dmi = targetDMIPerHead(p, load.date) * mult;
        const totalAsFedPerHead = dmFraction>0 ? dmi/dmFraction : 0;
        totalAsFedForPen = totalAsFedPerHead * (p.headCount||0);
      }
      return sum + totalAsFedForPen * pctFrac;
    }, 0));
    const prior = existingByIng[it.ingredientId] || {};
    return {
      ingredientId: it.ingredientId,
      targetIncremental,
      targetCumulative: 0, // set below in recomputeActuals, which owns the cumulative rebasing
      actualCumulative: prior.actualCumulative ?? null,
      skipped: prior.skipped || false
    };
  });
  load.entries = newEntries;
  recomputeActuals(load);
}

function recomputeActuals(load){
  // basis is wherever the scale actually reads right now -- the last
  // entered actual reading, or the plan's own running total if nothing's
  // been entered yet for this stretch. Each entry's displayed cum target
  // is rebased off THIS, not off the original plan, so if you over- or
  // undershoot one ingredient, every target after it corrects for it.
  let basis = load.startingWeight || 0;
  let totalTarget = 0, totalActual = 0, anyActual=false;
  load.entries.forEach(e=>{
    totalTarget += e.skipped ? 0 : e.targetIncremental;
    if(e.skipped){
      // Nothing added, so the scale target doesn't move -- carry basis through.
      e.targetCumulative = round1(basis);
      e.actualIncremental = 0;
      e.variance = null; e.variancePct = null;
      return;
    }
    e.targetCumulative = round1(basis + e.targetIncremental);
    if(e.actualCumulative===null || e.actualCumulative===undefined || e.actualCumulative===''){
      e.actualIncremental = null; e.variance=null; e.variancePct=null;
      basis = e.targetCumulative; // no actual yet -- coast the plan forward
    } else {
      const ac = Number(e.actualCumulative);
      e.actualIncremental = round1(ac - basis);
      e.variance = round1(e.actualIncremental - e.targetIncremental);
      e.variancePct = e.targetIncremental !== 0
        ? round1((e.variance/e.targetIncremental)*100)
        : (e.actualIncremental !== 0 ? 100 : 0);
      basis = ac; // rebase everything after this off the real reading
      totalActual += e.actualIncremental;
      anyActual = true;
    }
  });
  load.totalTargetLbs = round1(totalTarget);
  load.totalActualLbs = anyActual ? round1(totalActual) : null;
  load.overallVariancePct = (anyActual && totalTarget!==0) ? round1(((totalActual-totalTarget)/totalTarget)*100) : null;
  const allFilled = load.entries.every(e=> e.skipped || (e.actualCumulative!==null && e.actualCumulative!==undefined && e.actualCumulative!==''));
  load.status = allFilled && load.entries.length>0 ? 'done' : (anyActual ? 'in-progress' : 'pending');
}

// Estimated per-pen split of a combined load. We can't know exactly which
// pen got which pounds once ingredients are mixed together, so actuals are
// allocated proportionally to each pen's share of the ration target.
// Every pen in a load eats the same mix, so each pen's fraction of the
// full-ration targets is also its fraction of the skip-adjusted actual mix;
// shares are taken pen-vs-pen (summing to exactly 1) and then scaled by the
// load's real totals, so skipped ingredients shrink every pen's numbers
// proportionally instead of inflating the allocation past the load total.
function loadPenBreakdown(load){
  const ration = rationById(load.rationId);
  const dmFraction = rationWeightedDmFraction(ration);
  const referenceTotalAsFed = ration ? (Number(ration.referenceTotalAsFed)||0) : 0;
  const fullTargets = (load.pens||[]).map(p=>{
    const mult = 1 + ((p.adjustPct||0)/100);
    if(!p.intakeMode || p.intakeMode==='rationAsIs'){
      return referenceTotalAsFed * (p.headCount||0) * mult;
    }
    const dmi = targetDMIPerHead(p, load.date) * mult;
    const totalAsFedPerHead = dmFraction>0 ? dmi/dmFraction : 0;
    return totalAsFedPerHead * (p.headCount||0);
  });
  const fullSum = fullTargets.reduce((s,v)=>s+v,0);
  return (load.pens||[]).map((p,i)=>{
    const share = fullSum>0 ? fullTargets[i]/fullSum : 0;
    const targetTotal = round1((load.totalTargetLbs||0) * share);
    const actualTotal = (load.totalActualLbs!==null && load.totalActualLbs!==undefined) ? round1(load.totalActualLbs*share) : null;
    const variancePct = (actualTotal!==null && targetTotal!==0) ? round1(((actualTotal-targetTotal)/targetTotal)*100) : null;
    const projectedWeightToday = (p.intakeMode==='pctBW') ? projectedWeight(p, load.date) : null;
    const targetDMIToday = (p.intakeMode && p.intakeMode!=='rationAsIs') ? targetDMIPerHead(p, load.date) : null;
    return {...p, targetTotal, actualTotal, variancePct, projectedWeightToday, targetDMIToday};
  });
}

/* ---------------- field delivery math ---------------- */
// Feed that never goes through the mixer wagon: bale grazing, filling an
// unmetered supplement feeder on stalks. One Group per entry. daysCovered
// is typed in ON PURPOSE, never inferred -- a bale drop meant to last 4
// days has to be judged against 4 days' worth of target, and delivery
// timing alone can't tell you that. Each ingredient line is independently
// either count x estimated unit weight (3 bales x 1250 lb) or a straight
// lb estimate. Everything here is AS-FED -- that's the basis a bale weight
// or estimate is in; DM shows as info only. Group snapshots (name / head
// count / target rate) are frozen onto the entry at save time so history
// stays intact if the group is later edited or deleted, same as loads do
// with pens and rations.
function fdLineLbs(line){
  if(line.mode==='count') return round1((Number(line.count)||0) * (Number(line.unitWeight)||0));
  return round1(Number(line.lbs)||0);
}
function fdTotals(fd){
  const actual = round1((fd.lines||[]).reduce((s,l)=>s+fdLineLbs(l),0));
  const days = Number(fd.daysCovered)||1;
  const target = round1((fd.headCount||0) * (Number(fd.targetRate)||0) * days);
  const variancePct = target>0 ? round1(((actual-target)/target)*100) : null;
  const perHdDay = (fd.headCount>0 && days>0) ? round1(actual/fd.headCount/days) : null;
  let dmActual = 0;
  (fd.lines||[]).forEach(l=>{ dmActual += fdLineLbs(l) * (ingredientDmPct(l.ingredientId)/100); });
  return {actual, target, variancePct, perHdDay, dmActual: round1(dmActual)};
}
function fdIngName(line){ return line.ingredientName || ingredientName(line.ingredientId); }

/* ---------------- routing / render ---------------- */
let currentTab = 'today';
let currentDate = todayStr();
let lastKnownToday = todayStr();
let openLoadId = null; // when set, load-entry fullscreen is showing
let openRationId = null; // when set, ration editor fullscreen is showing ('new' for new)
let openPenEditId = null; // when set, pen roster editor fullscreen is showing ('new' for new)
let openGroupEditId = null; // when set, group editor fullscreen is showing ('new' for new)
let historyFilter = '';
let showArchivedPens = false;
let showArchivedGroups = false;

// Android keeps installed web apps suspended in memory for days. Without
// this, an app resumed the next morning still treats yesterday as "today":
// new loads get logged under the wrong date and the pending-report banner
// never appears. On return to foreground, if the calendar day has rolled
// over, snap the Today view forward -- but never while an editor is open
// mid-entry (a load being entered at 11:58pm correctly belongs to the day
// it was started).
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState!=='visible') return;
  // Android rarely cold-loads an installed web app, so "return to
  // foreground" is this app's real "app open". A stale Ranch Savvy cache
  // gets refreshed quietly in the background here (guarded inside against
  // repainting over an open editor).
  if(ranchSavvyConfigured() && rsStaleMs() > 6*3600000) refreshRanchSavvy(false);
  const now = todayStr();
  if(now===lastKnownToday) return;
  const wasViewingToday = currentDate===lastKnownToday;
  lastKnownToday = now;
  if(openLoadId||openRationId||openPenEditId||openGroupEditId) return;
  if(wasViewingToday || currentTab==='today'){ currentDate = now; }
  render();
});

// Banner greets you each new day and gets out of the way on the first
// button tap (any button, tabs included). It stays gone the rest of that
// day and comes back the next morning. In-memory only: a full reload
// shows it again, which is harmless.
let bannerDismissedOn = null;
document.addEventListener('click', e=>{
  if(!e.target.closest || !e.target.closest('button')) return;
  if(bannerDismissedOn===todayStr()) return;
  bannerDismissedOn = todayStr();
  const el = document.getElementById('homeLogo');
  if(el) el.hidden = true;
}, true);

function setTab(t){ currentTab=t; openLoadId=null; openRationId=null; openPenEditId=null; openGroupEditId=null; render(); }

document.querySelectorAll('.tabbar button').forEach(b=>{
  b.addEventListener('click', ()=> setTab(b.dataset.tab));
});

function render(){
  document.querySelectorAll('.tabbar button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab===currentTab);
  });
  const app = document.getElementById('app');
  // logo lives outside #app so the (large) image isn't re-decoded on every
  // render -- just shown on the Today tab and hidden everywhere else,
  // including the fullscreen editors
  document.getElementById('homeLogo').hidden =
    !(currentTab==='today' && !openLoadId && !openRationId && !openPenEditId && !openGroupEditId
      && bannerDismissedOn!==todayStr());
  if(openLoadId){ app.innerHTML=''; renderLoadEntry(openLoadId); return; }
  if(openRationId){ app.innerHTML=''; renderRationEditor(openRationId); return; }
  if(openPenEditId){ app.innerHTML=''; renderPenEditor(openPenEditId); return; }
  if(openGroupEditId){ app.innerHTML=''; renderGroupEditor(openGroupEditId); return; }
  if(currentTab==='today') app.innerHTML = renderToday();
  else if(currentTab==='pens') app.innerHTML = renderPens();
  else if(currentTab==='rations') app.innerHTML = renderRations();
  else if(currentTab==='history') app.innerHTML = renderHistory();
  else if(currentTab==='settings') app.innerHTML = renderSettings();
  wireTabEvents();
}

/* ================= TODAY TAB ================= */
function getOrCreateFeedCall(dateStr){
  let fc = state.feedCalls.find(f=>f.date===dateStr);
  if(!fc){ fc = {id:uid(), date:dateStr, loads:[]}; state.feedCalls.push(fc); }
  return fc;
}

function renderToday(){
  const fc = state.feedCalls.find(f=>f.date===currentDate);
  const loads = fc ? fc.loads : [];
  const fds = fc ? (fc.fieldDeliveries||[]) : [];
  let totalTarget = loads.reduce((s,l)=>s+(l.totalTargetLbs||0),0);
  let totalActual = loads.reduce((s,l)=> l.totalActualLbs!==null && l.totalActualLbs!==undefined ? s+l.totalActualLbs : s,0);

  const pending = pendingReportDates();
  const showBanner = currentDate===todayStr() && pending.length>0;
  const banner = showBanner ? `
  <div class="card" style="border-color:var(--yellow);background:var(--yellow-bg)" data-jumpdate="${pending[0]}" id="pendingReportBanner">
    <b>${pending.length} earlier day${pending.length===1?'':'s'} still need${pending.length===1?'s':''} a report sent.</b>
    <div class="muted" style="margin-top:4px">Tap to jump to ${displayDate(pending[0])}${pending.length>1?' (oldest first)':''}.</div>
  </div>` : '';

  const reportCard = feedCallHasContent(fc) ? `
  <div class="card">
    <h2>Daily Report</h2>
    <label>Comments for this day's report (optional)</label>
    <textarea id="reportComments" rows="3" placeholder="e.g. scale reading off on the DDGS auger, short on hay">${escapeHtml(fc.comments||'')}</textarea>
    <div class="field-row" style="margin-top:10px">
      <button class="btn ${fc.reportDriveAt?'ghost':'secondary'} block" id="saveToDriveBtn">${fc.reportDriveAt?'✅ Saved to Drive':'Save to Drive'}</button>
      <button class="btn ${fc.reportEmailAt?'ghost':'secondary'} block" id="emailReportBtn">${fc.reportEmailAt?'✅ Emailed':'Email Report'}</button>
    </div>
  </div>` : '';

  const prevFc = findPreviousFeedCall(currentDate);
  const repeatCard = prevFc ? `
  <div class="card">
    <div class="muted" style="font-weight:700;margin-bottom:6px">Repeat from ${displayDate(prevFc.date)}</div>
    ${prevFc.loads.map(l=>{
      const ration = rationById(l.rationId);
      const penNames = (l.pens||[]).map(p=>p.penName).join(', ');
      return `
      <div class="row" style="padding:6px 0;border-bottom:1px solid #eee">
        <div>
          <div>${escapeHtml(penNames)}</div>
          <div class="muted">${ration?escapeHtml(ration.name):(l.rationName?escapeHtml(l.rationName):'(ration deleted)')}</div>
        </div>
        <button class="btn secondary small" data-repeatload="${l.id}" data-repeatdate="${prevFc.date}">Copy to Today &rarr;</button>
      </div>`;
    }).join('')}
  </div>` : '';

  return `
  ${banner}
  <div class="card">
    <div class="row">
      <button class="link" id="prevDay">◀ prev</button>
      <div style="text-align:center">
        <div style="font-weight:700">${displayDate(currentDate)}</div>
        <input type="date" id="datePicker" value="${currentDate}" style="margin-top:6px;">
      </div>
      <button class="link" id="nextDay">next ▶</button>
    </div>
  </div>

  ${loads.length ? `<div class="card row">
      <div><div class="muted">Day total target</div><div class="bignum">${fmt(totalTarget)} lb</div></div>
      <div><div class="muted">Day total actual</div><div class="bignum">${totalActual? fmt(totalActual):'-'} lb</div></div>
    </div>` : ''}

  <button class="btn block" id="addLoadBtn">+ Add Load to Today's Feed Call</button>
  ${repeatCard}

  <div style="margin-top:12px">
    ${loads.length===0 ? `<div class="empty">No loads added for this date yet.<br>Tap "Add Load" and pick pens from your roster &mdash; combine several into one load if they share a ration.</div>` :
      loads.map(l=>renderLoadCard(l)).join('')}
  </div>

  <div style="margin-top:16px">
    <div style="font-weight:700;margin-bottom:6px">Field Deliveries <span class="muted" style="font-weight:400">&mdash; feed that skips the mixer</span></div>
    ${fds.length ? fds.map(fd=>renderFdCard(fd,false)).join('') : `<div class="muted" style="margin-bottom:8px">None logged for this date.</div>`}
    <button class="btn secondary block" id="addFdBtn">+ Add Field Delivery (bales / feeder)</button>
  </div>

  ${reportCard}
  `;
}

function renderFdCard(fd, readOnly){
  const t = fdTotals(fd);
  const varTag = t.variancePct!==null
    ? `<span class="variance-tag ${varianceClass(t.variancePct)}">${t.variancePct>0?'+':''}${fmt(t.variancePct)}%</span>`
    : `<span class="variance-tag v-none">no target</span>`;
  const lineSummary = (fd.lines||[]).map(l=>
    l.mode==='count'
      ? `${escapeHtml(fdIngName(l))} ${fmt(l.count)}&times;${fmt(l.unitWeight)}`
      : `${escapeHtml(fdIngName(l))} ${fmt(fdLineLbs(l))} lb`
  ).join(' &middot; ');
  return `
  <div class="card" data-fd="${fd.id}">
    <div class="row">
      <div>
        <div style="font-weight:700">${escapeHtml(fd.groupName)}</div>
        <div class="muted">${fd.headCount} hd &middot; covers ${fd.daysCovered} day${fd.daysCovered==1?'':'s'} &middot; target ${fmt(fd.targetRate)} lb/hd/day</div>
      </div>
      ${readOnly?'':`<button class="small-x" data-delfd="${fd.id}">✕</button>`}
    </div>
    ${lineSummary?`<div class="muted" style="margin-top:4px">${lineSummary}</div>`:''}
    <div class="row" style="margin-top:8px">
      <div class="muted">Delivered <b>${fmt(t.actual)} lb</b> / target ${fmt(t.target)} lb ${varTag}</div>
      ${t.perHdDay!==null?`<div class="muted">${fmt(t.perHdDay)} lb/hd/day</div>`:''}
    </div>
    ${readOnly?'':`<button class="btn secondary block" style="margin-top:8px" data-editfd="${fd.id}">Edit Delivery</button>`}
  </div>`;
}

function renderLoadCard(load){
  const ration = rationById(load.rationId);
  const totalHead = (load.pens||[]).reduce((s,p)=>s+(p.headCount||0),0);
  const penNames = (load.pens||[]).map(p=>`${escapeHtml(p.penName)} (${p.headCount})`).join(', ');
  const statusLabel = load.status==='done' ? 'Done' : (load.status==='in-progress'?'In Progress':'Pending');
  const badgeClass = load.status==='done' ? 'done' : 'pending';
  const varTag = load.overallVariancePct!==null ? `<span class="variance-tag ${varianceClass(load.overallVariancePct)}">${load.overallVariancePct>0?'+':''}${fmt(load.overallVariancePct)}%</span>` : '';
  return `
  <div class="card" data-load="${load.id}">
    <div class="row">
      <div>
        <div style="font-weight:700">${penNames}</div>
        <div class="muted">${totalHead} hd total &middot; ${ration ? escapeHtml(ration.name) : '(ration deleted)'}</div>
      </div>
      <button class="small-x" data-delload="${load.id}">✕</button>
    </div>
    <div class="row" style="margin-top:8px">
      <div class="muted">Target: <b>${fmt(load.totalTargetLbs)} lb</b>${load.totalActualLbs!==null?` &nbsp;Actual: <b>${fmt(load.totalActualLbs)} lb</b> ${varTag}`:''}</div>
      <span class="badge ${badgeClass}">${statusLabel}</span>
    </div>
    <button class="btn secondary block" style="margin-top:8px" data-openload="${load.id}">${load.status==='done'?'Review Load':'Enter Load →'}</button>
  </div>`;
}

function wireTabEvents(){
  if(currentTab==='today'){
    document.getElementById('prevDay')?.addEventListener('click', ()=>{ shiftDate(-1); });
    document.getElementById('nextDay')?.addEventListener('click', ()=>{ shiftDate(1); });
    document.getElementById('datePicker')?.addEventListener('change', e=>{ currentDate = e.target.value; render(); });
    document.getElementById('addLoadBtn')?.addEventListener('click', openAddLoadSheet);
    document.querySelectorAll('[data-repeatload]').forEach(b=>b.addEventListener('click', e=>{
      const sourceDate = e.currentTarget.dataset.repeatdate;
      const prevFc = state.feedCalls.find(f=>f.date===sourceDate);
      const sourceLoad = prevFc && prevFc.loads.find(l=>l.id===e.currentTarget.dataset.repeatload);
      if(sourceLoad) openRepeatLoadSheet(sourceLoad, sourceDate);
    }));
    document.querySelectorAll('[data-openload]').forEach(b=>b.addEventListener('click', ()=>{
      openLoadId = b.dataset.openload; render();
    }));
    document.querySelectorAll('[data-delload]').forEach(b=>b.addEventListener('click', ()=>{
      confirmAction("Remove this load from today's feed call? This deletes its entered data too.", ()=>{
        const fc = state.feedCalls.find(f=>f.date===currentDate);
        fc.loads = fc.loads.filter(l=>l.id!==b.dataset.delload);
        saveState(); render();
      });
    }));
    document.getElementById('addFdBtn')?.addEventListener('click', ()=> openFieldDeliverySheet(null));
    document.querySelectorAll('[data-editfd]').forEach(b=>b.addEventListener('click', ()=>{
      const fc = state.feedCalls.find(f=>f.date===currentDate);
      const fd = fc && (fc.fieldDeliveries||[]).find(x=>x.id===b.dataset.editfd);
      if(fd) openFieldDeliverySheet(fd);
    }));
    document.querySelectorAll('[data-delfd]').forEach(b=>b.addEventListener('click', ()=>{
      confirmAction('Remove this field delivery from this date?', ()=>{
        const fc = state.feedCalls.find(f=>f.date===currentDate);
        if(fc) fc.fieldDeliveries = (fc.fieldDeliveries||[]).filter(x=>x.id!==b.dataset.delfd);
        saveState(); render();
      });
    }));
    document.getElementById('pendingReportBanner')?.addEventListener('click', e=>{
      currentDate = e.currentTarget.dataset.jumpdate; render();
    });
    document.getElementById('reportComments')?.addEventListener('change', e=>{
      const fc = state.feedCalls.find(f=>f.date===currentDate);
      if(fc){ fc.comments = e.target.value; saveState(); }
    });
    // Buttons snapshot the textarea's LIVE value first: relying on the change
    // event alone loses a just-typed comment if the tap lands before blur fires.
    const snapshotComments = ()=>{
      const fc = state.feedCalls.find(f=>f.date===currentDate);
      const box = document.getElementById('reportComments');
      if(fc && box){ fc.comments = box.value; saveState(); }
      return fc;
    };
    document.getElementById('saveToDriveBtn')?.addEventListener('click', ()=>{
      const fc = snapshotComments();
      if(fc) shareReportToDrive(fc);
    });
    document.getElementById('emailReportBtn')?.addEventListener('click', ()=>{
      const fc = snapshotComments();
      if(fc) emailReport(fc);
    });
  }
  if(currentTab==='pens'){
    document.getElementById('newPenBtn')?.addEventListener('click', ()=>{ openPenEditId='new'; render(); });
    document.querySelectorAll('[data-editpen]').forEach(b=>b.addEventListener('click', ()=>{ openPenEditId=b.dataset.editpen; render(); }));
    document.getElementById('toggleArchived')?.addEventListener('click', ()=>{ showArchivedPens=!showArchivedPens; render(); });
    document.querySelectorAll('[data-archivepen]').forEach(b=>b.addEventListener('click', e=>{
      const p = state.pens.find(x=>x.id===e.target.dataset.archivepen);
      if(p){ p.archived = !p.archived; saveState(); render(); }
    }));
    document.querySelectorAll('[data-delpen]').forEach(b=>b.addEventListener('click', e=>{
      confirmAction('Delete this pen from your roster? Loads already built from it keep their own snapshot, so past history is unaffected.', ()=>{
        state.pens = state.pens.filter(x=>x.id!==e.target.dataset.delpen);
        saveState(); render();
      });
    }));
    document.getElementById('rsRefreshBtn')?.addEventListener('click', async e=>{
      e.target.disabled = true; e.target.textContent = 'Refreshing...';
      await refreshRanchSavvy(true);
      const btn = document.getElementById('rsRefreshBtn');
      if(btn){ btn.disabled = false; btn.textContent = 'Refresh'; }
    });
    document.getElementById('newGroupBtn')?.addEventListener('click', ()=>{ openGroupEditId='new'; render(); });
    document.querySelectorAll('[data-editgroup]').forEach(b=>b.addEventListener('click', ()=>{ openGroupEditId=b.dataset.editgroup; render(); }));
    document.getElementById('toggleArchivedGroups')?.addEventListener('click', ()=>{ showArchivedGroups=!showArchivedGroups; render(); });
    document.querySelectorAll('[data-archivegroup]').forEach(b=>b.addEventListener('click', e=>{
      const g = (state.groups||[]).find(x=>x.id===e.target.dataset.archivegroup);
      if(g){ g.archived = !g.archived; saveState(); render(); }
    }));
    document.querySelectorAll('[data-delgroup]').forEach(b=>b.addEventListener('click', e=>{
      confirmAction('Delete this group? Field deliveries already logged keep their own snapshot, so past history is unaffected.', ()=>{
        state.groups = (state.groups||[]).filter(x=>x.id!==e.target.dataset.delgroup);
        saveState(); render();
      });
    }));
  }
  if(currentTab==='rations'){
    document.getElementById('newRationBtn')?.addEventListener('click', ()=>{ openRationId='new'; render(); });
    document.querySelectorAll('[data-editration]').forEach(b=>b.addEventListener('click', ()=>{ openRationId=b.dataset.editration; render(); }));
    document.querySelectorAll('[data-delration]').forEach(b=>b.addEventListener('click', ()=>{
      confirmAction('Delete this ration? Past history using it is unaffected.', ()=>{
        state.rations = state.rations.filter(r=>r.id!==b.dataset.delration);
        saveState(); render();
      });
    }));
    document.querySelectorAll('[data-dupration]').forEach(b=>b.addEventListener('click', ()=>{
      const r = rationById(b.dataset.dupration);
      const copy = JSON.parse(JSON.stringify(r));
      copy.id = uid(); copy.name = r.name + ' (copy)';
      state.rations.push(copy); saveState(); render();
    }));
  }
  if(currentTab==='history'){
    document.getElementById('histFilter')?.addEventListener('input', e=>{ historyFilter=e.target.value; render(); });
    document.getElementById('exportCsvBtn')?.addEventListener('click', exportCsv);
    document.getElementById('exportPenCsvBtn')?.addEventListener('click', exportPenSummaryCsv);
    document.querySelectorAll('[data-viewload]').forEach(b=>b.addEventListener('click', ()=>{
      openLoadId = b.dataset.viewload; render();
    }));
  }
  if(currentTab==='settings'){
    wireSettingsEvents();
  }
}

function shiftDate(delta){
  const [y,m,d]=currentDate.split('-').map(Number);
  const dt = new Date(y,m-1,d);
  dt.setDate(dt.getDate()+delta);
  currentDate = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  render();
}

/* ---- shared pens editor sheet: used for "Add Load" and "Edit Pens" ---- */
// opts: {title, confirmLabel, forDate, initialRationId, initialStartWeight, initialPens, onSave(rationId,startWeight,pens)}
// Each draft row has source:'roster'|'oneoff'. Roster rows are picked from
// the saved pen list (name/weight/ADG/intake locked to the roster, only
// head count & call adjustment are editable per-load); one-off rows are
// typed fresh and never saved to the roster.
function openPensSheet(opts){
  if(state.rations.length===0){
    showToast('Add a ration first (Rations tab)');
    return;
  }
  const forDate = opts.forDate || currentDate;
  let draftPens = (opts.initialPens||[]).map(p=>{
    if(p.rosterId){
      const rp = state.pens.find(x=>x.id===p.rosterId);
      return {
        source:'roster', rosterId:p.rosterId, id:p.id,
        penName: rp?rp.penName:p.penName,
        headCount: p.headCount, adjustPct: p.adjustPct,
        anchorWeight: rp?rp.anchorWeight:p.anchorWeight,
        anchorDate: rp?rp.anchorDate:p.anchorDate,
        adg: rp?rp.adg:p.adg,
        intakeMode: rp?rp.intakeMode:p.intakeMode,
        intakeValue: rp?rp.intakeValue:p.intakeValue
      };
    }
    return {source:'oneoff', rosterId:null, id:p.id, penName:p.penName, headCount:p.headCount, adjustPct:p.adjustPct,
      anchorWeight:null, anchorDate:null, adg:0, intakeMode:'rationAsIs', intakeValue:0};
  });
  let rationId = opts.initialRationId || state.rations[0].id;
  let startWeight = opts.initialStartWeight ?? 0;

  function rosterInfoLine(p){
    if(p.source!=='roster') return 'One-off pen &mdash; not saved to your roster';
    if(!p.intakeMode || p.intakeMode==='rationAsIs') return 'Uses ration as entered (no DM targeting)';
    if(p.intakeMode==='flatDM') return `Flat target: ${fmt(p.intakeValue)} lb DM/hd/day`;
    const w = projectedWeight(p, forDate);
    const dmi = targetDMIPerHead(p, forDate);
    return `~${fmt(w)} lb today &middot; ${p.intakeValue}% BW = ${fmt(dmi)} lb DM/hd target`;
  }

  function penRowsHtml(){
    return draftPens.map((p,idx)=>`
      <div class="subcard">
        <div class="row">
          <div style="font-weight:700">${p.source==='roster'?escapeHtml(p.penName):'One-off pen'}</div>
          <button class="small-x" data-removepenrow="${idx}">✕</button>
        </div>
        <div class="muted" style="margin-bottom:4px">${rosterInfoLine(p)}</div>
        ${p.source==='oneoff' ? `
        <label>Pen / Lot Name</label>
        <input type="text" data-penname="${idx}" value="${escapeHtml(p.penName||'')}" placeholder="e.g. Pen 4 - Steers">` : ''}
        <div class="field-row">
          <div><label>Head Count</label><input type="number" inputmode="numeric" min="1" data-penhead="${idx}" value="${p.headCount||''}" placeholder="0"></div>
          <div><label>Call Adj %</label><input type="number" inputmode="decimal" data-penadj="${idx}" value="${p.adjustPct||0}" placeholder="0"></div>
        </div>
      </div>`).join('');
  }

  function patchPenSheetTotal(){
    const el = document.getElementById('penSheetTotalHead');
    if(!el) return;
    const totalHead = draftPens.reduce((s,p)=>s+(Number(p.headCount)||0),0);
    el.textContent = `${totalHead} hd total across ${draftPens.length} pen${draftPens.length===1?'':'s'}`;
  }

  function addPenOptionsHtml(){
    const usedRosterIds = new Set(draftPens.filter(p=>p.rosterId).map(p=>p.rosterId));
    const available = state.pens.filter(rp=>!rp.archived && !usedRosterIds.has(rp.id));
    return `
    <option value="">Add a pen to this load...</option>
    ${available.map(rp=>`<option value="${rp.id}">${escapeHtml(rp.penName)} (${rp.headCount} hd)</option>`).join('')}
    <option value="__oneoff__">➕ One-off pen (not saved to roster)</option>`;
  }

  function paintSheet(){
    const totalHead = draftPens.reduce((s,p)=>s+(Number(p.headCount)||0),0);
    const html = `
    <div class="overlay" id="overlay">
      <div class="sheet">
        <div class="row"><h2>${escapeHtml(opts.title)}</h2><button class="x-close" id="closeSheet">✕</button></div>
        <label>Ration (shared by every pen in this load)</label>
        <select id="rationSelect">
          ${state.rations.map(r=>`<option value="${r.id}" ${r.id===rationId?'selected':''}>${escapeHtml(r.name)}</option>`).join('')}
        </select>
        <div id="penRows" style="margin-top:10px">${penRowsHtml()}</div>
        <label style="margin-top:4px">Add a pen</label>
        <select id="addPenSelect">${addPenOptionsHtml()}</select>
        <label style="margin-top:12px">Starting Scale Weight (lb) &mdash; leave 0 if you zero the scale</label>
        <input type="number" id="startWeightField" inputmode="decimal" value="${startWeight}">
        <div class="muted" style="margin-top:8px" id="penSheetTotalHead">${totalHead} hd total across ${draftPens.length} pen${draftPens.length===1?'':'s'}</div>
        <div class="modal-actions">
          <button class="btn ghost" id="cancelAdd">Cancel</button>
          <button class="btn" id="confirmAdd">${escapeHtml(opts.confirmLabel||'Save')}</button>
        </div>
      </div>
    </div>`;
    document.getElementById('overlay')?.remove();
    document.body.insertAdjacentHTML('beforeend', html);

    document.getElementById('closeSheet').onclick = closeSheetEl;
    document.getElementById('cancelAdd').onclick = closeSheetEl;
    document.getElementById('rationSelect').onchange = e=>{ rationId = e.target.value; };
    document.getElementById('startWeightField').oninput = e=>{ startWeight = Number(e.target.value)||0; };
    document.getElementById('addPenSelect').onchange = e=>{
      const val = e.target.value;
      if(!val) return;
      if(val==='__oneoff__'){
        draftPens.push({source:'oneoff', rosterId:null, penName:'', headCount:'', adjustPct:0,
          anchorWeight:null, anchorDate:null, adg:0, intakeMode:'rationAsIs', intakeValue:0});
      } else {
        const rp = state.pens.find(x=>x.id===val);
        if(rp){
          if(draftPens.length===0 && rp.lastRationId && state.rations.some(r=>r.id===rp.lastRationId)){
            rationId = rp.lastRationId;
          }
          draftPens.push({source:'roster', rosterId:rp.id, penName:rp.penName,
            headCount:rp.headCount, adjustPct:rp.lastAdjustPct||0,
            anchorWeight:rp.anchorWeight, anchorDate:rp.anchorDate, adg:rp.adg,
            intakeMode:rp.intakeMode, intakeValue:rp.intakeValue});
        }
      }
      paintSheet();
    };
    document.querySelectorAll('[data-removepenrow]').forEach(b=>b.addEventListener('click', e=>{
      draftPens.splice(Number(e.target.dataset.removepenrow),1);
      paintSheet();
    }));
    document.querySelectorAll('[data-penname]').forEach(inp=>inp.addEventListener('input', e=>{
      draftPens[Number(e.target.dataset.penname)].penName = e.target.value;
    }));
    document.querySelectorAll('[data-penhead]').forEach(inp=>inp.addEventListener('input', e=>{
      draftPens[Number(e.target.dataset.penhead)].headCount = e.target.value;
      patchPenSheetTotal();
    }));
    document.querySelectorAll('[data-penadj]').forEach(inp=>inp.addEventListener('input', e=>{
      draftPens[Number(e.target.dataset.penadj)].adjustPct = e.target.value;
    }));
    document.getElementById('confirmAdd').onclick = ()=>{
      const cleanPens = [];
      draftPens.forEach(p=>{
        const headCount = Number(p.headCount)||0;
        const adjustPct = Number(p.adjustPct)||0;
        if(!headCount) return;
        if(p.source==='roster'){
          const rp = state.pens.find(x=>x.id===p.rosterId);
          cleanPens.push({
            id: p.id||uid(), rosterId: p.rosterId,
            penName: rp?rp.penName:p.penName, headCount, adjustPct,
            anchorWeight: rp?rp.anchorWeight:p.anchorWeight,
            anchorDate: rp?rp.anchorDate:p.anchorDate,
            adg: rp?rp.adg:p.adg,
            intakeMode: rp?rp.intakeMode:p.intakeMode,
            intakeValue: rp?rp.intakeValue:p.intakeValue
          });
        } else {
          const penName = (p.penName||'').trim();
          if(!penName) return;
          cleanPens.push({
            id: p.id||uid(), rosterId: null, penName, headCount, adjustPct,
            anchorWeight:null, anchorDate:null, adg:0, intakeMode:'rationAsIs', intakeValue:0
          });
        }
      });
      if(cleanPens.length===0){ showToast('Add at least one pen with a head count'); return; }
      const chosenRation = rationById(rationId);
      const refTotal = chosenRation ? (Number(chosenRation.referenceTotalAsFed)||0) : 0;
      if(refTotal<=0 && cleanPens.some(p=>!p.intakeMode || p.intakeMode==='rationAsIs')){
        showToast('Heads up: this ration has no reference total, so "ration as entered" pens get 0 lb targets');
      }
      closeSheetEl();
      opts.onSave(rationId, startWeight, cleanPens);
    };
  }
  paintSheet();
}
function closeSheetEl(){ document.getElementById('overlay')?.remove(); }

// Roster pens keep the head count / call adjustment / last-used ration they
// were fed with, so next time you build a load you're not retyping them.
function writeBackRosterPens(pens, rationId){
  pens.forEach(p=>{
    if(!p.rosterId) return;
    const rp = state.pens.find(x=>x.id===p.rosterId);
    if(!rp) return;
    // a Ranch-Savvy-linked pen's roster count belongs to the sync, not to
    // per-load edits -- the load itself still keeps whatever count was
    // typed for it (a per-load snapshot), it just doesn't overwrite the
    // roster's synced number
    if(!rp.rsHerdId) rp.headCount = p.headCount;
    rp.lastAdjustPct = p.adjustPct;
    rp.lastRationId = rationId;
  });
}

function openAddLoadSheet(){
  openPensSheet({
    title: "Add Load to Today's Feed Call",
    confirmLabel: 'Add Load',
    forDate: currentDate,
    initialRationId: state.rations[0]?.id,
    initialStartWeight: 0,
    initialPens: [],
    onSave(rationId, startWeight, pens){
      const fc = getOrCreateFeedCall(currentDate);
      const load = {id:uid(), date:currentDate, rationId, startingWeight:startWeight, pens, entries:[], status:'pending'};
      buildTargets(load);
      fc.loads.push(load);
      writeBackRosterPens(pens, rationId);
      saveState();
      showToast(pens.length>1 ? `Load added (${pens.length} pens combined)` : 'Load added');
      render();
    }
  });
}

// Most days repeat the prior day's loads almost as-is, just a little heavier
// on ADG. Weight-gain math needs no special handling here -- it falls out
// automatically: pen intake targets are computed from each pen's LIVE
// anchorWeight/ADG at load-build time (see targetDMIPerHead/projectedWeight),
// so simply building a new load dated today already reflects however much
// the animals have grown since the roster's anchor date. What this actually
// saves is re-picking the same pens and ration by hand every morning.
function findPreviousFeedCall(beforeDate){
  const priors = state.feedCalls.filter(fc=> fc.date<beforeDate && fc.loads && fc.loads.length>0);
  if(priors.length===0) return null;
  priors.sort((a,b)=> b.date.localeCompare(a.date));
  return priors[0];
}
function openRepeatLoadSheet(sourceLoad, sourceDate){
  const initialPens = (sourceLoad.pens||[]).map(p=>{
    if(p.rosterId){
      const rp = state.pens.find(x=>x.id===p.rosterId);
      return {
        id: uid(), rosterId: p.rosterId,
        penName: rp?rp.penName:p.penName,
        headCount: rp?rp.headCount:p.headCount, // refreshed from the roster, not copied from yesterday -- surfaces any add/remove for review
        adjustPct: 0, // call adjustment resets -- it's meant to reflect TODAY's conditions (cold snap, didn't clean up), not carry forward automatically
        anchorWeight: rp?rp.anchorWeight:p.anchorWeight,
        anchorDate: rp?rp.anchorDate:p.anchorDate,
        adg: rp?rp.adg:p.adg,
        intakeMode: rp?rp.intakeMode:p.intakeMode,
        intakeValue: rp?rp.intakeValue:p.intakeValue
      };
    }
    return {
      id: uid(), rosterId: null, penName: p.penName, headCount: p.headCount, adjustPct: 0,
      anchorWeight: null, anchorDate: null, adg: 0, intakeMode: 'rationAsIs', intakeValue: 0
    };
  });
  openPensSheet({
    title: `Repeat Load from ${displayDate(sourceDate)}`,
    confirmLabel: 'Add Load',
    forDate: currentDate,
    initialRationId: sourceLoad.rationId,
    initialStartWeight: 0,
    initialPens,
    onSave(rationId, startWeight, pens){
      const fc = getOrCreateFeedCall(currentDate);
      const load = {id:uid(), date:currentDate, rationId, startingWeight:startWeight, pens, entries:[], status:'pending'};
      buildTargets(load);
      fc.loads.push(load);
      writeBackRosterPens(pens, rationId);
      saveState();
      showToast(pens.length>1 ? `Load added (${pens.length} pens combined)` : 'Load added');
      render();
    }
  });
}

function openEditPensSheet(loadId){
  const found = findLoad(loadId);
  if(!found) return;
  const {load} = found;
  openPensSheet({
    title: 'Edit Pens in this Load',
    confirmLabel: 'Save Changes',
    forDate: load.date,
    initialRationId: load.rationId,
    initialStartWeight: load.startingWeight,
    initialPens: load.pens,
    onSave(rationId, startWeight, pens){
      load.rationId = rationId;
      load.startingWeight = startWeight;
      load.pens = pens;
      buildTargets(load); // keeps already-entered scale readings, recalculates targets
      writeBackRosterPens(pens, rationId);
      saveState();
      showToast('Load updated');
      renderLoadEntry(loadId);
    }
  });
}

/* ---- field delivery sheet: log/edit feed that skipped the mixer ---- */
// A delivery is complete the moment it's saved -- no pending/done workflow
// like mixer loads, because there's no ingredient-by-ingredient scale
// entry happening in real time; you're recording what you just dropped.
// Editing a past date's delivery works by navigating Today to that date.
function openFieldDeliverySheet(existingFd){
  const activeGroups = (state.groups||[]).filter(g=>!g.archived);
  if(!existingFd && activeGroups.length===0){
    showToast('Add a Group first (Roster tab)');
    return;
  }
  if(state.ingredients.length===0){
    showToast('Add an ingredient first (Settings tab)');
    return;
  }
  const editing = !!existingFd;
  let draft = editing
    ? JSON.parse(JSON.stringify(existingFd))
    : {
        id: uid(),
        groupId: activeGroups[0].id,
        daysCovered: 1,
        lines: [{id:uid(), ingredientId: state.ingredients[0].id, mode:'count', count:'', unitWeight:'', lbs:''}]
      };
  if(!draft.lines || draft.lines.length===0){
    draft.lines = [{id:uid(), ingredientId: state.ingredients[0].id, mode:'count', count:'', unitWeight:'', lbs:''}];
  }

  // live group lookup for the preview; save() re-snapshots from the same place
  function draftGroup(){
    return groupById(draft.groupId)
      || {name: draft.groupName||'(deleted group)', headCount: draft.headCount||0, targetRate: draft.targetRate||0};
  }
  function previewTotals(){
    const g = draftGroup();
    return fdTotals({
      headCount: g.headCount, targetRate: g.targetRate,
      daysCovered: draft.daysCovered, lines: draft.lines
    });
  }
  function totalsLineHtml(){
    const g = draftGroup();
    const t = previewTotals();
    const varTag = t.variancePct!==null
      ? `<span class="variance-tag ${varianceClass(t.variancePct)}">${t.variancePct>0?'+':''}${fmt(t.variancePct)}%</span>` : '';
    return `Target: <b>${fmt(t.target)} lb</b> (${g.headCount} hd &times; ${fmt(g.targetRate)} lb/hd/day &times; ${fmt(Number(draft.daysCovered)||1)} day${(Number(draft.daysCovered)||1)==1?'':'s'})<br>
      Delivered: <b>${fmt(t.actual)} lb</b> ${varTag}${t.perHdDay!==null?` &middot; ${fmt(t.perHdDay)} lb/hd/day`:''}<br>
      <span class="muted">~${fmt(t.dmActual)} lb DM delivered (info only &mdash; targets here are as-fed)</span>`;
  }
  function patchTotals(){
    const el = document.getElementById('fdTotalsLine');
    if(el) el.innerHTML = totalsLineHtml();
  }

  function lineRowsHtml(){
    return draft.lines.map((l,idx)=>`
      <div class="subcard">
        <div class="row">
          <select data-fding="${idx}" style="flex:1">
            ${state.ingredients.map(ing=>`<option value="${ing.id}" ${ing.id===l.ingredientId?'selected':''}>${escapeHtml(ing.name)}</option>`).join('')}
            <option value="__new__">➕ New ingredient...</option>
          </select>
          <button class="small-x" data-fdremove="${idx}">✕</button>
        </div>
        <div class="row" style="margin-top:6px;gap:8px">
          <select data-fdmode="${idx}" style="flex:1">
            <option value="count" ${l.mode==='count'?'selected':''}>Count &times; unit weight</option>
            <option value="direct" ${l.mode==='direct'?'selected':''}>Direct lb estimate</option>
          </select>
        </div>
        ${l.mode==='count' ? `
        <div class="field-row" style="margin-top:6px">
          <div><label>Count</label><input type="number" inputmode="decimal" data-fdcount="${idx}" value="${l.count??''}" placeholder="e.g. 3"></div>
          <div><label>Est. unit weight (lb)</label><input type="number" inputmode="decimal" data-fdunit="${idx}" value="${l.unitWeight??''}" placeholder="e.g. 1250"></div>
        </div>` : `
        <div style="margin-top:6px"><label>Estimated lb</label><input type="number" inputmode="decimal" data-fdlbs="${idx}" value="${l.lbs??''}" placeholder="e.g. 300"></div>`}
        <div class="muted" id="fdLineLbs-${idx}" style="margin-top:4px">= ${fmt(fdLineLbs(l))} lb</div>
      </div>`).join('');
  }
  function patchLineLbs(idx){
    const el = document.getElementById('fdLineLbs-'+idx);
    if(el) el.textContent = '= '+fmt(fdLineLbs(draft.lines[idx]))+' lb';
  }

  function paintSheet(){
    const groupOpts = activeGroups.map(g=>
      `<option value="${g.id}" ${g.id===draft.groupId?'selected':''}>${escapeHtml(g.name)} (${g.headCount} hd &middot; ${fmt(g.targetRate)} lb/hd/day)</option>`
    ).join('');
    // an edited entry whose group was since deleted keeps working off its snapshot
    const orphanOpt = (editing && !groupById(draft.groupId))
      ? `<option value="${escapeHtml(draft.groupId)}" selected>${escapeHtml(draft.groupName||'(deleted group)')} (snapshot)</option>` : '';
    const html = `
    <div class="overlay" id="overlay">
      <div class="sheet">
        <div class="row"><h2>${editing?'Edit Field Delivery':'Field Delivery'}</h2><button class="x-close" id="closeSheet">✕</button></div>
        <label>Group</label>
        <select id="fdGroupSelect">${orphanOpt}${groupOpts}</select>
        <label>Days this delivery covers</label>
        <input type="number" inputmode="decimal" id="fdDays" min="0.5" step="0.5" value="${draft.daysCovered}">
        <div class="muted" style="margin-top:4px">Typed on purpose, not guessed from timing &mdash; a bale drop meant to last 4 days gets judged against 4 days' worth of target.</div>
        <label style="margin-top:12px">What was delivered</label>
        <div id="fdLines">${lineRowsHtml()}</div>
        <button class="link" id="fdAddLine" style="margin-top:4px">+ Add ingredient line</button>
        <div class="muted" style="margin-top:12px" id="fdTotalsLine">${totalsLineHtml()}</div>
        <div class="modal-actions">
          <button class="btn ghost" id="fdCancel">Cancel</button>
          <button class="btn" id="fdSave">${editing?'Save Changes':'Log Delivery'}</button>
        </div>
      </div>
    </div>`;
    document.getElementById('overlay')?.remove();
    document.body.insertAdjacentHTML('beforeend', html);

    document.getElementById('closeSheet').onclick = closeSheetEl;
    document.getElementById('fdCancel').onclick = closeSheetEl;
    document.getElementById('fdGroupSelect').onchange = e=>{ draft.groupId = e.target.value; patchTotals(); };
    document.getElementById('fdDays').oninput = e=>{ draft.daysCovered = e.target.value; patchTotals(); };
    document.getElementById('fdAddLine').onclick = ()=>{
      draft.lines.push({id:uid(), ingredientId: state.ingredients[0].id, mode:'count', count:'', unitWeight:'', lbs:''});
      paintSheet();
    };
    document.querySelectorAll('[data-fdremove]').forEach(b=>b.addEventListener('click', e=>{
      draft.lines.splice(Number(e.target.dataset.fdremove),1);
      if(draft.lines.length===0) draft.lines.push({id:uid(), ingredientId: state.ingredients[0].id, mode:'count', count:'', unitWeight:'', lbs:''});
      paintSheet();
    }));
    document.querySelectorAll('[data-fding]').forEach(sel=>sel.addEventListener('change', e=>{
      const idx = Number(e.target.dataset.fding);
      if(e.target.value==='__new__'){
        const name = prompt('New ingredient name:');
        if(name && name.trim()){
          const newIng = {id:uid(), name:name.trim(), dmPct:guessDmPct(name.trim())};
          state.ingredients.push(newIng);
          draft.lines[idx].ingredientId = newIng.id;
          saveState();
        }
        paintSheet();
      } else {
        draft.lines[idx].ingredientId = e.target.value;
        patchLineLbs(idx); patchTotals();
      }
    }));
    document.querySelectorAll('[data-fdmode]').forEach(sel=>sel.addEventListener('change', e=>{
      const idx = Number(e.target.dataset.fdmode);
      draft.lines[idx].mode = e.target.value;
      paintSheet();
    }));
    const wireNum = (attr, field)=>{
      document.querySelectorAll('['+attr+']').forEach(inp=>inp.addEventListener('input', e=>{
        const idx = Number(e.target.dataset[field.ds]);
        draft.lines[idx][field.key] = e.target.value;
        patchLineLbs(idx); patchTotals();
      }));
    };
    wireNum('data-fdcount', {ds:'fdcount', key:'count'});
    wireNum('data-fdunit',  {ds:'fdunit',  key:'unitWeight'});
    wireNum('data-fdlbs',   {ds:'fdlbs',   key:'lbs'});

    document.getElementById('fdSave').onclick = ()=>{
      const lines = (draft.lines||[]).map(l=>({
        id: l.id||uid(),
        ingredientId: l.ingredientId,
        ingredientName: ingredientName(l.ingredientId), // snapshot at record time, like loads do
        mode: l.mode,
        count: l.mode==='count' ? (Number(l.count)||0) : null,
        unitWeight: l.mode==='count' ? (Number(l.unitWeight)||0) : null,
        lbs: l.mode==='direct' ? (Number(l.lbs)||0) : null
      })).filter(l=> fdLineLbs(l)>0);
      if(lines.length===0){ showToast('Enter at least one ingredient amount'); return; }
      const g = groupById(draft.groupId);
      const clean = {
        id: draft.id,
        groupId: draft.groupId,
        groupName:  g ? g.name       : (draft.groupName||'(deleted group)'),
        headCount:  g ? g.headCount  : (draft.headCount||0),
        targetRate: g ? g.targetRate : (draft.targetRate||0),
        daysCovered: Math.max(0.5, Number(draft.daysCovered)||1),
        lines,
        createdAt: draft.createdAt || new Date().toISOString()
      };
      const fc = getOrCreateFeedCall(currentDate);
      fc.fieldDeliveries = fc.fieldDeliveries||[];
      const i = fc.fieldDeliveries.findIndex(x=>x.id===clean.id);
      if(i>=0) fc.fieldDeliveries[i]=clean; else fc.fieldDeliveries.push(clean);
      saveState();
      closeSheetEl();
      showToast(editing?'Delivery updated':'Field delivery logged');
      render();
    };
  }
  paintSheet();
}

/* ================= LOAD ENTRY (fullscreen) ================= */
function findLoad(loadId){
  for(const fc of state.feedCalls){
    const l = fc.loads.find(x=>x.id===loadId);
    if(l) return {fc,load:l};
  }
  return null;
}

function renderLoadEntry(loadId){
  const found = findLoad(loadId);
  if(!found){ openLoadId=null; render(); return; }
  const {fc,load} = found;
  const ration = rationById(load.rationId);
  const totalHead = (load.pens||[]).reduce((s,p)=>s+(p.headCount||0),0);

  const rows = load.entries.map((e,idx)=>{
    const varTag = e.variancePct!==null && !e.skipped
      ? `<span class="variance-tag ${varianceClass(e.variancePct)}">${e.variancePct>0?'+':''}${fmt(e.variancePct)}%</span>`
      : (e.skipped ? `<span class="variance-tag v-none">skip</span>` : `<span class="variance-tag v-none">-</span>`);
    return `
    <tr id="row-${idx}">
      <td>
        <div style="font-weight:600">${escapeHtml(ingredientName(e.ingredientId))}</div>
        <div class="checkbox-row muted"><input type="checkbox" id="skipCb-${idx}" data-skip="${idx}" ${e.skipped?'checked':''}> not fed today</div>
      </td>
      <td id="targetCell-${idx}"><div class="muted">${fmt(e.targetIncremental)} lb</div><div class="cum-target">cum ${fmt(e.targetCumulative)}</div></td>
      <td>
        <input type="number" inputmode="decimal" id="actualInput-${idx}" data-actual="${idx}" placeholder="0" value="${e.actualCumulative!==null&&e.actualCumulative!==undefined?e.actualCumulative:''}" ${e.skipped?'disabled':''}>
      </td>
      <td id="varCell-${idx}">${e.skipped ? '-' : fmt(e.actualIncremental)}<div>${varTag}</div></td>
    </tr>`;
  }).join('');

  const penListHtml = (load.pens||[]).map(p=>{
    let info = '';
    if(p.intakeMode==='pctBW'){
      const w = projectedWeight(p, load.date);
      const dmi = targetDMIPerHead(p, load.date);
      info = `~${fmt(w)} lb &middot; ${p.intakeValue}% BW = ${fmt(dmi)} lb DM/hd`;
    } else if(p.intakeMode==='flatDM'){
      info = `flat ${fmt(p.intakeValue)} lb DM/hd`;
    }
    return `
    <div class="row" style="padding:3px 0;align-items:flex-start">
      <div>${escapeHtml(p.penName)}</div>
      <div class="muted" style="text-align:right">${p.headCount} hd${p.adjustPct?`, call ${p.adjustPct>0?'+':''}${p.adjustPct}%`:''}${info?`<br>${info}`:''}</div>
    </div>`;
  }).join('');

  const breakdown = load.pens && load.pens.length>1 ? loadPenBreakdown(load) : null;

  const html = `
  <div class="fs-header">
    <button class="back" id="backBtn">←</button>
    <div>
      <div style="font-weight:700">${ration?escapeHtml(ration.name):'(ration deleted)'}</div>
      <div class="sub">${totalHead} hd total &middot; ${displayDate(fc.date)}</div>
    </div>
  </div>
  <div class="fs-body">
    <div class="card">
      <div class="row">
        <div class="muted" style="font-weight:700">Pens in this load</div>
        ${load.status!=='done' ? `<button class="btn ghost small" id="editPensBtn">Edit Pens</button>` : ''}
      </div>
      <div style="margin-top:4px">${penListHtml}</div>
    </div>
    <div class="card">
      <label>Starting Scale Weight (lb)</label>
      <input type="number" inputmode="decimal" id="startWeightEdit" value="${load.startingWeight}">
      <div class="muted" style="margin-top:6px">Enter the scale reading (cumulative) after adding each ingredient. The app works out the actual pounds added and compares it to target.</div>
    </div>
    <div class="card">
      <table class="load">
        <thead><tr><th>Ingredient</th><th>Target lb</th><th>Actual scale reading</th><th>Actual / Var</th></tr></thead>
        <tbody id="loadRows">${rows}</tbody>
      </table>
    </div>
    <div class="card row">
      <div>
        <div class="muted">Target total</div>
        <div class="bignum" id="totalTargetVal">${fmt(load.totalTargetLbs)} lb</div>
      </div>
      <div>
        <div class="muted">Actual total</div>
        <div class="bignum" id="totalActualVal">${load.totalActualLbs!==null?fmt(load.totalActualLbs):'-'} lb</div>
      </div>
      <div>
        <div class="muted">Load variance</div>
        <div class="bignum" id="totalVarVal">${load.overallVariancePct!==null?(load.overallVariancePct>0?'+':'')+fmt(load.overallVariancePct)+'%':'-'}</div>
      </div>
    </div>
    ${breakdown ? `
    <div class="card" id="penBreakdownCard">
      <h2>Per-Pen Split (estimated)</h2>
      <div class="muted" style="margin-bottom:6px">Allocated by each pen's share of the ration target &mdash; there's no way to measure exactly which pen got what once it's mixed together in one load.</div>
      <div id="penBreakdownRows">${breakdown.map(p=>`
        <div class="row" style="padding:4px 0">
          <div>${escapeHtml(p.penName)} <span class="muted">(${p.headCount} hd)</span></div>
          <div><b>${p.actualTotal!==null?fmt(p.actualTotal):fmt(p.targetTotal)} lb</b>${p.actualTotal===null?' <span class="muted">target</span>':(p.variancePct!==null?` <span class="variance-tag ${varianceClass(p.variancePct)}">${p.variancePct>0?'+':''}${fmt(p.variancePct)}%</span>`:'')}</div>
        </div>`).join('')}
      </div>
    </div>` : ''}
    <button class="btn block" id="doneBtn">${load.status==='done'?'Load Marked Done ✓':'Mark Load Done'}</button>
  </div>`;
  document.getElementById('app').innerHTML = html;

  document.getElementById('backBtn').onclick = ()=>{ openLoadId=null; render(); };
  document.getElementById('editPensBtn')?.addEventListener('click', ()=> openEditPensSheet(loadId));
  // NOTE: none of the handlers below tear down / re-render the row markup while the
  // user could be mid-tap into another field. Full innerHTML replacement here would
  // detach the very input the user's next tap is landing on and silently eat the tap
  // (confirmed with automated testing) -- so all live updates patch existing DOM nodes
  // in place via patchLoadEntryUI() instead of calling renderLoadEntry() again.
  document.getElementById('startWeightEdit').onchange = (e)=>{
    load.startingWeight = Number(e.target.value)||0;
    buildTargets(load); saveState();
    patchLoadEntryUI(load);
  };
  document.querySelectorAll('[data-skip]').forEach(cb=>cb.addEventListener('change', e=>{
    const idx = Number(e.target.dataset.skip);
    load.entries[idx].skipped = e.target.checked;
    // toggling skip shifts the cumulative target for every row after this one,
    // so rebuild targets (not just recompute actuals).
    buildTargets(load); saveState();
    patchLoadEntryUI(load);
    const inputEl = document.getElementById('actualInput-'+idx);
    if(inputEl) inputEl.disabled = e.target.checked;
  }));
  document.querySelectorAll('[data-actual]').forEach((inp,i)=>{
    inp.addEventListener('input', e=>{
      const idx = Number(e.target.dataset.actual);
      const v = e.target.value;
      load.entries[idx].actualCumulative = v===''? null : Number(v);
      recomputeActuals(load); saveState();
      patchLoadEntryUI(load);
    });
    inp.addEventListener('keydown', e=>{
      if(e.key==='Enter'){
        e.preventDefault();
        const allInputs = Array.from(document.querySelectorAll('[data-actual]'));
        const next = allInputs[i+1];
        if(next) next.focus(); else e.target.blur();
      }
    });
  });
  document.getElementById('doneBtn').onclick = ()=>{
    const unfilled = load.entries.some(e=>!e.skipped && (e.actualCumulative===null||e.actualCumulative===undefined||e.actualCumulative===''));
    // Snapshot names now, at the moment of record -- so this load stays
    // accurate even if the ration or an ingredient is later renamed/deleted,
    // and the daily report is self-contained without needing live lookups.
    const markDone = ()=>{
      load.status='done'; load.completedAt=new Date().toISOString();
      load.rationName = ration ? ration.name : '(ration deleted)';
      load.entries.forEach(e=>{ e.ingredientName = ingredientName(e.ingredientId); });
      saveState();
    };
    if(unfilled){
      confirmAction("Some ingredients don't have an actual weight entered yet. Mark done anyway?", ()=>{
        markDone();
        showToast('Load saved');
        renderLoadEntry(loadId);
      });
      return;
    }
    markDone();
    showToast('Load saved');
    openLoadId=null; render();
  };
}

// Patches the numbers on screen after an edit, without replacing any input
// element -- safe to call from 'input'/'change' handlers mid-interaction.
function patchLoadEntryUI(load){
  load.entries.forEach((e,idx)=>{
    const targetCell = document.getElementById('targetCell-'+idx);
    if(targetCell) targetCell.innerHTML = `<div class="muted">${fmt(e.targetIncremental)} lb</div><div class="cum-target">cum ${fmt(e.targetCumulative)}</div>`;
    const varCell = document.getElementById('varCell-'+idx);
    if(varCell){
      const varTag = e.variancePct!==null && !e.skipped
        ? `<span class="variance-tag ${varianceClass(e.variancePct)}">${e.variancePct>0?'+':''}${fmt(e.variancePct)}%</span>`
        : (e.skipped ? `<span class="variance-tag v-none">skip</span>` : `<span class="variance-tag v-none">-</span>`);
      varCell.innerHTML = `${e.skipped ? '-' : fmt(e.actualIncremental)}<div>${varTag}</div>`;
    }
  });
  const tt = document.getElementById('totalTargetVal'); if(tt) tt.textContent = fmt(load.totalTargetLbs)+' lb';
  const ta = document.getElementById('totalActualVal'); if(ta) ta.textContent = (load.totalActualLbs!==null?fmt(load.totalActualLbs):'-')+' lb';
  const tv = document.getElementById('totalVarVal'); if(tv) tv.textContent = load.overallVariancePct!==null?(load.overallVariancePct>0?'+':'')+fmt(load.overallVariancePct)+'%':'-';
  const breakdownRows = document.getElementById('penBreakdownRows');
  if(breakdownRows && load.pens && load.pens.length>1){
    const breakdown = loadPenBreakdown(load);
    breakdownRows.innerHTML = breakdown.map(p=>`
      <div class="row" style="padding:4px 0">
        <div>${escapeHtml(p.penName)} <span class="muted">(${p.headCount} hd)</span></div>
        <div><b>${p.actualTotal!==null?fmt(p.actualTotal):fmt(p.targetTotal)} lb</b>${p.actualTotal===null?' <span class="muted">target</span>':(p.variancePct!==null?` <span class="variance-tag ${varianceClass(p.variancePct)}">${p.variancePct>0?'+':''}${fmt(p.variancePct)}%</span>`:'')}</div>
      </div>`).join('');
  }
}
