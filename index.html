function rsLinkLine(entry){
  if(!entry.rsHerdId) return '';
  if(rsLinkBroken(entry)){
    return `<div class="muted text-warn" style="margin-top:4px">⟳ linked herd no longer in Ranch Savvy &mdash; count frozen at last pull</div>`;
  }
  const h = rsHerdById(entry.rsHerdId);
  return `<div class="muted" style="margin-top:4px">⟳ head count synced from Ranch Savvy${h?`: ${escapeHtml(h.name)}`:''} (as of ${rsFetchedAtLabel()})</div>`;
}

function renderGroupCard(g){
  return `
  <div class="card" data-group="${g.id}">
    <div style="font-weight:700">${escapeHtml(g.name)}${g.archived?' <span class="badge pending">Archived</span>':''}</div>
    <div class="muted">${g.headCount} hd &middot; target ${fmt(g.targetRate)} lb as-fed/hd/day</div>
    ${rsLinkLine(g)}
    ${g.notes ? `<div class="muted" style="margin-top:4px;font-style:italic">${escapeHtml(g.notes)}</div>` : ''}
    <div class="row" style="margin-top:10px;gap:6px">
      <button class="btn secondary small" data-editgroup="${g.id}">Edit</button>
      <button class="btn ghost small" data-archivegroup="${g.id}">${g.archived?'Unarchive':'Archive'}</button>
      <button class="btn danger small" data-delgroup="${g.id}">Delete</button>
    </div>
  </div>`;
}

function renderPenCard(p){
  const w = projectedWeight(p, todayStr());
  let intakeLine;
  if(p.intakeMode==='pctBW'){
    const dmi = targetDMIPerHead(p, todayStr());
    intakeLine = `${p.intakeValue}% BW &rarr; ~${fmt(dmi)} lb DM/hd today`;
  } else if(p.intakeMode==='flatDM'){
    intakeLine = `Flat ${fmt(p.intakeValue)} lb DM/hd/day`;
  } else {
    intakeLine = `Uses ration as entered (no DM targeting)`;
  }
  const ration = p.lastRationId ? rationById(p.lastRationId) : null;
  return `
  <div class="card" data-pen="${p.id}">
    <div style="font-weight:700">${escapeHtml(p.penName)}${p.archived?' <span class="badge pending">Archived</span>':''}</div>
    <div class="muted">${p.headCount} hd &middot; ~${fmt(w)} lb today &middot; ADG ${fmt(p.adg)} lb/day</div>
    ${rsLinkLine(p)}
    <div class="muted" style="margin-top:4px">${intakeLine}</div>
    ${ration ? `<div class="muted">Last ration: ${escapeHtml(ration.name)}</div>` : ''}
    ${p.notes ? `<div class="muted" style="margin-top:4px;font-style:italic">${escapeHtml(p.notes)}</div>` : ''}
    <div class="row" style="margin-top:10px;gap:6px">
      <button class="btn secondary small" data-editpen="${p.id}">Edit</button>
      <button class="btn ghost small" data-archivepen="${p.id}">${p.archived?'Unarchive':'Archive'}</button>
      <button class="btn danger small" data-delpen="${p.id}">Delete</button>
    </div>
  </div>`;
}

function renderPenEditor(penId){

  function previewLine(){

    document.getElementById('app').innerHTML = `

    </div>
    <div class="fs-body">

        <label>Head Count</label>

        <label>Link head count to Ranch Savvy herd</label>
        ${rsLinkSelectHtml('rsLinkSelect', draft.rsHerdId)}
        <div class="muted" style="margin-top:4px" id="rsLinkNote">${draft.rsHerdId
          ? `Count comes from Ranch Savvy on every pull (last: ${rsFetchedAtLabel()}). Unlink to type it by hand.`
          : `Linking keeps this count matched to the live active-animal count in Ranch Savvy. Read-only &mdash; nothing is ever written back.`}</div>
        ` : ''}
      </div>
      <div class="card">
        <h2>Weight &amp; Gain</h2>
        <div class="field-row">
          <div><label>Weight (lb/hd)</label><input type="number" inputmode="decimal" id="anchorWeight" value="${draft.anchorWeight}" placeholder="0"></div>
          <div><label>As of Date</label><input type="date" id="anchorDate" value="${draft.anchorDate}"></div>
        </div>
        <label>ADG (lb/hd/day)</label>
        <input type="number" inputmode="decimal" id="adg" value="${draft.adg}" placeholder="0">
        <div class="muted" style="margin-top:6px">Weight projects forward from here using ADG. When you get a new actual weight, update these two fields and set the date to today &mdash; everything downstream recalculates.</div>
      </div>

        </select>
        <div id="intakeValueWrap" style="${draft.intakeMode==='rationAsIs'?'display:none':''}">

function renderRationEditor(rationId){
  const isNew = rationId==='new';
  let draft;
  if(isNew){
    draft = {id:uid(), name:'', referenceTotalAsFed:0, items:[]};
  } else {
    draft = JSON.parse(JSON.stringify(rationById(rationId)));
    if(draft.referenceTotalAsFed===undefined) draft.referenceTotalAsFed = 0;
  }

  function rowHint(idx){
    const it = draft.items[idx];
    const dmPct = ingredientDmPct(it.ingredientId);
    const pct = Number(it.pctAsFed)||0;
    const refTotal = Number(draft.referenceTotalAsFed)||0;
    const asFedAtRef = refTotal>0 ? round1(refTotal * pct/100) : null;
    const dmAtRef = asFedAtRef!==null ? round1(asFedAtRef * dmPct/100) : null;
    return `DM ${fmt(dmPct)}%${asFedAtRef!==null ? ` &rarr; ${fmt(asFedAtRef)} lb as-fed (${fmt(dmAtRef)} lb DM) at reference` : ''}`;
  }

  function rowsHtml(){
    return draft.items.map((it,idx)=>`
      <div class="ing-row" data-row="${idx}">
        <select data-ingsel="${idx}">
          ${state.ingredients.map(ing=>`<option value="${ing.id}" ${ing.id===it.ingredientId?'selected':''}>${escapeHtml(ing.name)}</option>`).join('')}
          <option value="__new__">➕ New ingredient...</option>
        </select>
        <input class="lbsw" type="number" inputmode="decimal" data-pct="${idx}" value="${it.pctAsFed}" placeholder="% as-fed">
        <div class="updown">
          <button data-up="${idx}" ${idx===0?'disabled':''}>▲</button>
          <button data-down="${idx}" ${idx===draft.items.length-1?'disabled':''}>▼</button>
        </div>
        <button class="small-x" data-removerow="${idx}">✕</button>
      </div>
      <div class="muted" id="dmHint-${idx}" style="margin:0 0 8px 2px">${rowHint(idx)}</div>`).join('');
  }

  function totalsLineHtml(){
    const totalPct = draft.items.reduce((s,it)=>s+(Number(it.pctAsFed)||0),0);
    const dmFrac = rationWeightedDmFraction(draft);
    const offBy = Math.abs(totalPct-100);
    return `Total: <b class="${offBy>0.5?'text-warn':''}">${fmt(totalPct)}%</b>${offBy>0.5?' (aim for 100% \u2014 targets still work off whatever it sums to, but it\u2019s easy to lose track otherwise)':''} &middot; Mix is ~${fmt(dmFrac*100)}% DM overall.`;
  }

  function refreshRowHints(){
    draft.items.forEach((it,idx)=>{
      const hint = document.getElementById('dmHint-'+idx);
      if(hint) hint.innerHTML = rowHint(idx);
    });
    const totalsLine = document.getElementById('ratioTotalsLine');
    if(totalsLine) totalsLine.innerHTML = totalsLineHtml();
  }

  function paint(){
    document.getElementById('app').innerHTML = `
    <div class="fs-header">
      <button class="back" id="backBtn">←</button>
      <div style="font-weight:700">${isNew?'New Ration':'Edit Ration'}</div>
    </div>
    <div class="fs-body">
      <div class="card">
        <label>Ration Name</label>
        <input type="text" id="rationName" value="${escapeHtml(draft.name)}" placeholder="e.g. Backgrounder Grower">
        <label style="margin-top:12px">Reference Total Mix Amount (lb as-fed/hd/day)</label>
        <input type="number" inputmode="decimal" id="refTotal" value="${draft.referenceTotalAsFed||0}" placeholder="e.g. 48">
        <div class="muted" style="margin-top:4px">Used for pens set to "Use ration as entered," and to show reference pounds per ingredient below. Not needed if every pen using this ration has its own DM intake target (%BW or flat DM, set on the Pens tab).</div>
        <label style="margin-top:12px">Ingredients (% of total mix, as-fed basis)</label>
        <div id="ingRows">${rowsHtml()}</div>
        <button class="link" id="addIngRow" style="margin-top:8px">+ Add ingredient row</button>
        <div class="muted" style="margin-top:10px" id="ratioTotalsLine">${totalsLineHtml()}</div>
        <div class="muted" style="margin-top:6px">Order here sets the mixing/weigh-up order. When a pen has its own DM intake target, the mix's blended DM% (above) converts that target into a total as-fed amount, then splits it across ingredients by their % share.</div>
      </div>
      <button class="btn block" id="saveRationBtn">Save Ration</button>
    </div>`;

    document.getElementById('backBtn').onclick = ()=>{ openRationId=null; render(); };
    document.getElementById('rationName').oninput = e=> draft.name = e.target.value;
    document.getElementById('refTotal').oninput = e=>{
      draft.referenceTotalAsFed = Number(e.target.value)||0;
      refreshRowHints();
    };
    document.getElementById('addIngRow').onclick = ()=>{
      const firstIng = state.ingredients[0];
      draft.items.push({ingredientId: firstIng?firstIng.id:null, pctAsFed:0});
      paint();
    };
    document.querySelectorAll('[data-removerow]').forEach(b=>b.addEventListener('click', e=>{
      draft.items.splice(Number(e.target.dataset.removerow),1); paint();
    }));
    document.querySelectorAll('[data-up]').forEach(b=>b.addEventListener('click', e=>{
      const i = Number(e.target.dataset.up);
      if(i>0){ [draft.items[i-1],draft.items[i]]=[draft.items[i],draft.items[i-1]]; paint(); }
    }));
    document.querySelectorAll('[data-down]').forEach(b=>b.addEventListener('click', e=>{
      const i = Number(e.target.dataset.down);
      if(i<draft.items.length-1){ [draft.items[i+1],draft.items[i]]=[draft.items[i],draft.items[i+1]]; paint(); }
    }));
    document.querySelectorAll('[data-pct]').forEach(inp=>inp.addEventListener('input', e=>{
      const idx = Number(e.target.dataset.pct);
      draft.items[idx].pctAsFed = Number(e.target.value)||0;
      refreshRowHints();
    }));
    document.querySelectorAll('[data-ingsel]').forEach(sel=>sel.addEventListener('change', e=>{
      const idx = Number(e.target.dataset.ingsel);
      if(e.target.value==='__new__'){
        const name = prompt('New ingredient name:');
        if(name && name.trim()){
          const newIng = {id:uid(), name:name.trim(), dmPct:guessDmPct(name.trim())};
          state.ingredients.push(newIng);
          draft.items[idx].ingredientId = newIng.id;
          saveState();
        }
        paint();
      } else {
        draft.items[idx].ingredientId = e.target.value;
        paint();
      }
    }));
    document.getElementById('saveRationBtn').onclick = ()=>{
      if(!draft.name.trim()){ showToast('Give the ration a name'); return; }
      if(draft.items.length===0){ showToast('Add at least one ingredient'); return; }
      if(isNew){ state.rations.push(draft); }
      else{
        const i = state.rations.findIndex(r=>r.id===rationId);
        state.rations[i] = draft;
      }
      saveState();
      openRationId=null;
      showToast('Ration saved');
      render();
    };
  }
  paint();
}

/* ================= HISTORY TAB ================= */
function renderHistory(){
  const dates = [...state.feedCalls].sort((a,b)=> b.date.localeCompare(a.date));
  const filt = historyFilter.trim().toLowerCase();
  let anyResults = false;
  const blocks = dates.map(fc=>{
    let loads = fc.loads;
    let fds = fc.fieldDeliveries||[];
    if(filt){
      loads = loads.filter(l=>{
        const r = rationById(l.rationId);
        const penMatch = (l.pens||[]).some(p=>p.penName.toLowerCase().includes(filt));
        return penMatch || (r && r.name.toLowerCase().includes(filt));
      });
      fds = fds.filter(fd=> (fd.groupName||'').toLowerCase().includes(filt));
    }
    if(loads.length===0 && fds.length===0) return '';
    anyResults = true;
    return `<div class="hist-date">${displayDate(fc.date)}</div>` + fds.map(fd=>renderFdCard(fd,true)).join('') + loads.map(l=>{
      const ration = rationById(l.rationId);
      const totalHead = (l.pens||[]).reduce((s,p)=>s+(p.headCount||0),0);
      const penNames = (l.pens||[]).map(p=>escapeHtml(p.penName)).join(', ');
      const varTag = l.overallVariancePct!==null ? `<span class="variance-tag ${varianceClass(l.overallVariancePct)}">${l.overallVariancePct>0?'+':''}${fmt(l.overallVariancePct)}%</span>` : '';
      return `<div class="card" data-viewload="${l.id}">
        <div class="row">
          <div>
            <div style="font-weight:700">${penNames}</div>
            <div class="muted">${totalHead} hd total &middot; ${ration?escapeHtml(ration.name):'(deleted)'}</div>
          </div>
          <span class="badge ${l.status==='done'?'done':'pending'}">${l.status==='done'?'Done':'Incomplete'}</span>
        </div>
        <div class="muted" style="margin-top:6px">Target ${fmt(l.totalTargetLbs)} lb &middot; Actual ${l.totalActualLbs!==null?fmt(l.totalActualLbs):'-'} lb ${varTag}</div>
      </div>`;
    }).join('');
  }).join('');

  return `
  <div class="card">
    <input type="text" id="histFilter" placeholder="Filter by pen or ration name" value="${escapeHtml(historyFilter)}">
  </div>
  <div class="field-row">
    <button class="btn secondary block" id="exportCsvBtn">Export Ingredient Detail (CSV)</button>
    <button class="btn secondary block" id="exportPenCsvBtn">Export Pen Summary (CSV)</button>
  </div>
  <div style="margin-top:10px">
    ${dates.length===0 ? `<div class="empty">No feed calls logged yet.</div>` : (anyResults?blocks:`<div class="empty">No matches.</div>`)}
  </div>`;
}

function exportCsv(){
  const rows = [['Date','Pens','Total Head Count','Ration','Ingredient','Target lb','Actual lb','Variance lb','Variance %','Skipped']];
  const dates = [...state.feedCalls].sort((a,b)=>a.date.localeCompare(b.date));
  dates.forEach(fc=>{
    fc.loads.forEach(l=>{
      const ration = rationById(l.rationId);
      const penNames = (l.pens||[]).map(p=>p.penName).join('; ');
      const totalHead = (l.pens||[]).reduce((s,p)=>s+(p.headCount||0),0);
      l.entries.forEach(e=>{
        rows.push([
          fc.date, penNames, totalHead, ration?ration.name:'',
          ingredientName(e.ingredientId), e.targetIncremental,
          e.actualIncremental??'', e.variance??'', e.variancePct??'', e.skipped?'yes':'no'
        ]);
      });
    });
    (fc.fieldDeliveries||[]).forEach(fd=>{
      const t = fdTotals(fd);
      const rationCol = `Field delivery - covers ${fd.daysCovered} day${fd.daysCovered==1?'':'s'}`;
      (fd.lines||[]).forEach(l=>{
        rows.push([fc.date, fd.groupName, fd.headCount, rationCol, fdIngName(l), '', fdLineLbs(l), '', '', 'no']);
      });
      rows.push([fc.date, fd.groupName, fd.headCount, rationCol, '(delivery total)', t.target, t.actual, round1(t.actual-t.target), t.variancePct??'', 'no']);
    });
  });
  downloadCsv(rows, `lunch-lady-feed-history-${todayStr()}.csv`);
}

function exportPenSummaryCsv(){
  const rows = [['Date','Pen','Head Count','Call Adjustment %','Ration','Combined With','Projected Weight lb','Target DMI lb/hd','Est Target lb','Est Actual lb','Est Variance %']];
  const dates = [...state.feedCalls].sort((a,b)=>a.date.localeCompare(b.date));
  dates.forEach(fc=>{
    fc.loads.forEach(l=>{
      const ration = rationById(l.rationId);
      const breakdown = loadPenBreakdown(l);
      breakdown.forEach(p=>{
        const others = (l.pens||[]).filter(op=>op.id!==p.id).map(op=>op.penName).join('; ');
        rows.push([
          fc.date, p.penName, p.headCount, p.adjustPct||0, ration?ration.name:'',
          others, p.projectedWeightToday??'', p.targetDMIToday??'', p.targetTotal, p.actualTotal??'', p.variancePct??''
        ]);
      });
    });
  });
  downloadCsv(rows, `lunch-lady-pen-summary-${todayStr()}.csv`);
}

function downloadCsv(rows, filename){
  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  downloadTextFile(csv, filename, 'text/csv');
}
function downloadTextFile(text, filename, mimeType){
  const blob = new Blob([text], {type: mimeType||'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function csvEscape(v){
  const s = String(v ?? '');
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}

function wireSettingsEvents(){
  document.getElementById('rsRefreshSettingsBtn')?.addEventListener('click', async e=>{
    e.target.disabled = true; e.target.textContent = 'Refreshing...';
    await refreshRanchSavvy(true);
    const btn = document.getElementById('rsRefreshSettingsBtn');
    if(btn){ btn.disabled = false; btn.textContent = 'Refresh'; }
  });
  document.getElementById('reporterName').onchange = e=>{ state.settings.reporterName = e.target.value; saveState(); };
  document.getElementById('yellowPct').onchange = e=>{ state.settings.yellowPct = Number(e.target.value)||0; saveState(); };
  document.getElementById('redPct').onchange = e=>{ state.settings.redPct = Number(e.target.value)||0; saveState(); };
  document.querySelectorAll('[data-renameing]').forEach(inp=>inp.addEventListener('change', e=>{
    const ing = state.ingredients.find(i=>i.id===e.target.dataset.renameing);
    if(ing){ ing.name = e.target.value.trim()||ing.name; saveState(); }
  }));
  document.querySelectorAll('[data-dmpct]').forEach(inp=>inp.addEventListener('change', e=>{
    const ing = state.ingredients.find(i=>i.id===e.target.dataset.dmpct);
    if(ing){
      let v = Number(e.target.value);
      if(!isFinite(v) || v<=0) v = 100;
      if(v>100) v = 100;
      ing.dmPct = round1(v);
      saveState();
    }
  }));
  document.querySelectorAll('[data-delling]').forEach(b=>b.addEventListener('click', e=>{
    const id = e.target.dataset.delling;
    const inUse = state.rations.some(r=>r.items.some(it=>it.ingredientId===id));
    if(inUse){ showToast('Remove it from rations first'); return; }
    confirmAction('Delete this ingredient?', ()=>{
      state.ingredients = state.ingredients.filter(i=>i.id!==id);
      saveState(); render();
    });
  }));
  document.getElementById('addIngBtn').onclick = ()=>{
    const name = prompt('New ingredient name:');
    if(name && name.trim()){
      state.ingredients.push({id:uid(), name:name.trim(), dmPct:guessDmPct(name.trim())});
      saveState(); render();
    }
  };
  document.getElementById('exportJsonBtn').onclick = ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `lunch-lady-backup-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };
  document.getElementById('importJsonFile').onchange = e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed.ingredients || !parsed.rations || !parsed.feedCalls) throw new Error('bad format');
        confirmAction('Replace all current data with this backup?', ()=>{
          state = parsed;
          migrateState();
          saveState(); showToast('Backup restored'); render();
        });
      }catch(err){ showToast('Could not read that file'); }
    };
    reader.readAsText(file);
  };
  document.getElementById('clearAllBtn').onclick = ()=>{
    confirmAction('This deletes ALL ingredients, rations, pens, and history on this phone. Export a backup first if unsure. Continue?', ()=>{
      state = defaultState();
      saveState(); showToast('All data cleared'); render();
    });
  };
}

/* ================= shared: confirm modal & escaping ================= */
function confirmAction(message, onConfirm){
  const html = `
  <div class="overlay" id="confirmOverlay">
    <div class="sheet">
      <p>${escapeHtml(message)}</p>
      <div class="modal-actions">
        <button class="btn ghost" id="confirmCancel">Cancel</button>
        <button class="btn danger" id="confirmYes">Confirm</button>
      </div>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  document.getElementById('confirmCancel').onclick = ()=> document.getElementById('confirmOverlay').remove();
  document.getElementById('confirmYes').onclick = ()=>{ document.getElementById('confirmOverlay').remove(); onConfirm(); };
}
function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------------- migration + init ---------------- */
// v1 -> v2: single-pen loads became combined loads with a pens[] array.
// v2 -> v3: ingredients gained DM%, a persistent pen roster was added, and
// ration items (previously as-fed) became DM-basis. To keep every existing
// ration behaving EXACTLY as before the moment this update lands, each
// ration item is converted using the freshly-seeded DM% so that dividing
// back through (DM / DM%) reconstructs the identical as-fed number as
// pre-update. Nothing about today's targets changes on its own -- it only
// changes once you deliberately correct an ingredient's DM% or put a pen
// on %BW/flat-DM targeting.
// v3 -> v4: ration items switched from an absolute lb DM/hd/day amount to
// a % of the total mix (as-fed basis), plus a single referenceTotalAsFed
// (lb as-fed/hd/day) on the ration itself. Each item's old DM amount is
// converted back to as-fed via its ingredient's DM%, summed to get the
// reference total, then expressed as a % share of that total -- this
// reconstructs the exact same mix and the exact same targets as pre-update.
function migrateState(){
  state.feedCalls = state.feedCalls || [];
  state.pens = state.pens || [];
  state.rations = state.rations || [];
  state.settings = state.settings || {};
  // Aug 2026 additions -- purely additive, so plain defaults (no version
  // guard needed; guards below are only for shape TRANSFORMATIONS)
  state.groups = state.groups || [];
  state.ranchSavvy = state.ranchSavvy || {herds:[], fetchedAt:null};
  state.pens.forEach(p=>{ if(p.rsHerdId===undefined) p.rsHerdId = null; });
  state.groups.forEach(g=>{
    if(g.rsHerdId===undefined) g.rsHerdId = null;
    if(g.archived===undefined) g.archived = false;
    if(g.notes===undefined) g.notes = '';
  });
  if(state.settings.yellowPct===undefined) state.settings.yellowPct = 3;
  if(state.settings.redPct===undefined) state.settings.redPct = 6;
  if(state.settings.reporterName===undefined) state.settings.reporterName = '';
  delete state.settings.writePassphrase; // leftover from a briefly-shipped cloud-sync build

  state.feedCalls.forEach(fc=>{
    if(!fc.loads && fc.pens){
      fc.loads = fc.pens.map(p=>({
        id: p.id, date: fc.date,
        rationId: p.rationId,
        startingWeight: p.startingWeight||0,
        pens: [{id:uid(), rosterId:null, penName:p.penName, headCount:p.headCount, adjustPct:p.adjustPct||0,
                 anchorWeight:null, anchorDate:null, adg:0, intakeMode:'rationAsIs', intakeValue:0}],
        entries: p.entries||[],
        status: p.status,
        totalTargetLbs: p.totalTargetLbs,
        totalActualLbs: p.totalActualLbs,
        overallVariancePct: p.overallVariancePct,
        completedAt: p.completedAt
      }));
      delete fc.pens;
    }
    if(!fc.loads) fc.loads = [];
    if(!fc.fieldDeliveries) fc.fieldDeliveries = [];
    fc.loads.forEach(load=>{
      if(!load.date) load.date = fc.date;
      if(!load.pens) load.pens = [];
      load.pens.forEach(p=>{
        if(p.intakeMode===undefined){ p.intakeMode='rationAsIs'; p.intakeValue=0; p.anchorWeight=null; p.anchorDate=null; p.adg=0; }
        if(p.rosterId===undefined) p.rosterId=null;
      });
    });
  });

  state.ingredients.forEach(ing=>{
    if(ing.dmPct===undefined || ing.dmPct===null) ing.dmPct = guessDmPct(ing.name);
  });

  const fromVersion = state.version||1; // capture BEFORE any step mutates it -- each guard below must see the ORIGINAL version, never an intermediate one

  if(fromVersion < 3){
    state.rations.forEach(r=>{
      r.items.forEach(it=>{
        const ing = state.ingredients.find(i=>i.id===it.ingredientId);
        const dmPct = ing ? ing.dmPct : 100;
        it.lbsPerHeadDay = round1(it.lbsPerHeadDay * (dmPct/100));
      });
    });
  }

  if(fromVersion < 4){
    state.rations.forEach(r=>{
      const asFedList = r.items.map(it=>{
        const ing = state.ingredients.find(i=>i.id===it.ingredientId);
        const dmPct = ing ? ing.dmPct : 100;
        return dmPct>0 ? (it.lbsPerHeadDay||0)/(dmPct/100) : (it.lbsPerHeadDay||0);
      });
      const totalAsFed = asFedList.reduce((s,v)=>s+v,0);
      r.items = r.items.map((it,idx)=>({
        ingredientId: it.ingredientId,
        pctAsFed: totalAsFed>0 ? round1(asFedList[idx]/totalAsFed*100) : round1(100/(r.items.length||1))
      }));
      r.referenceTotalAsFed = round1(totalAsFed);
    });
  }
  state.version = 4;

  // Existing entries keep their historically-recorded targets; only refresh
  // derived totals/status. Only truly-empty loads get a fresh buildTargets.
  state.feedCalls.forEach(fc=>{
    fc.loads.forEach(load=>{
      if(!load.entries || load.entries.length===0) buildTargets(load);
      else recomputeActuals(load);
    });
  });
}

migrateState();
saveState();
render();
// background pull on open -- fire-and-forget, cached, never blocks the UI;
// refreshRanchSavvy() guards its own re-render against open editors
if(ranchSavvyConfigured()) refreshRanchSavvy(false);
</script>
