<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lunch Lady</title>
<!-- installable app: Chrome only offers "Add to Home screen"/"Install app"
     when the page is served over https AND links a manifest + registers a
     service worker (sw.js keeps a copy on the phone so it opens offline) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d7141b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --green:#2e7d32; --green-bg:#e8f5e9;
    --yellow:#b8860b; --yellow-bg:#fff8e1;
    --red:#c62828; --red-bg:#fdecea;
    --ink:#1c1c1c; --sub:#5f5f5f; --line:#dcdcdc;
    --card:#ffffff; --bg:#f4f4f2;
    /* logo palette: tractor/lettering red, wagon yellow, LL black */
    --accent:#d7141b; --accent-dark:#a80f15; --wagon:#fcb80b; --ll:#161616;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:16px;}
  #app{max-width:560px;margin:0 auto;padding:12px 12px 90px 12px;}
  h1,h2,h3{margin:0 0 8px 0;}
  h1{font-size:19px;}
  h2{font-size:17px;}
  .topbar{position:sticky;top:0;background:var(--accent);color:#fff;padding:12px 14px;border-bottom:4px solid var(--wagon);
    display:flex;align-items:center;justify-content:space-between;z-index:20;}
  .topbar .title{font-weight:700;font-size:17px;}
  .topbar .sub{font-size:12px;opacity:.85;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:12px;margin-bottom:10px;}
  .subcard{background:#f8f8f6;border:1px solid var(--line);border-radius:8px;
    padding:10px;margin-bottom:8px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--ll);color:#fff;border:none;border-radius:8px;
    padding:12px 16px;font-size:15px;font-weight:600;min-height:46px;cursor:pointer;}
  .btn:active{background:#000;}
  .btn.secondary{background:#fff;color:var(--ll);border:1.5px solid var(--ll);}
  .btn.danger{background:#fff;color:var(--red);border:1.5px solid var(--red);}
  .btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);}
  .btn.block{width:100%;}
  .btn.small{padding:8px 10px;min-height:36px;font-size:13px;}
  .btn[disabled]{opacity:.45;pointer-events:none;}
  label{display:block;font-size:13px;color:var(--sub);margin:8px 0 4px;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;padding:11px 10px;font-size:16px;border:1px solid #bfbfbf;border-radius:8px;
    background:#fff;color:var(--ink);}
  input:focus,select:focus{outline:2px solid var(--accent);}
  .field-row{display:flex;gap:8px;}
  .field-row > div{flex:1;}
  .pillbar{display:flex;gap:8px;margin-bottom:10px;}
  .pill{flex:1;text-align:center;padding:6px 4px;border-radius:8px;font-size:13px;font-weight:600;}
  .pill.pending{background:#eee;color:var(--sub);}
  .pill.done{background:var(--green-bg);color:var(--green);}
  .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;
    letter-spacing:.03em;}
  .badge.pending{background:#e6e6e6;color:#555;}
  .badge.done{background:var(--green-bg);color:var(--green);}
  .muted{color:var(--sub);font-size:13px;}
  .bignum{font-size:22px;font-weight:700;}
  table.load{width:100%;border-collapse:collapse;font-size:14px;}
  table.load th{text-align:left;font-size:11px;color:var(--sub);padding:4px 4px;border-bottom:1px solid var(--line);
    text-transform:uppercase;letter-spacing:.03em;}
  table.load td{padding:7px 4px;border-bottom:1px solid #eee;vertical-align:middle;}
  table.load input[type=number]{padding:9px 4px;font-size:16px;width:100%;min-width:0;}
  table.load td:nth-child(3){width:78px;}
  .cum-target{font-size:22px;font-weight:800;color:var(--ink);margin-top:2px;line-height:1.15;}
  .text-warn{color:var(--red);}
  .variance-tag{display:inline-block;padding:2px 8px;border-radius:12px;font-weight:700;font-size:12px;}
  .v-green{background:var(--green-bg);color:var(--green);}
  .v-yellow{background:var(--yellow-bg);color:var(--yellow);}
  .v-red{background:var(--red-bg);color:var(--red);}
  .v-none{background:#eee;color:#888;}
  .tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;
    border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom);}
  .tabbar button{flex:1;background:none;border:none;padding:9px 2px 8px;font-size:11px;
    color:var(--sub);font-weight:600;cursor:pointer;}
  .tabbar button.active{color:var(--accent);}
  .tabbar button .ic{display:block;font-size:18px;margin-bottom:2px;}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;
    display:flex;align-items:flex-end;justify-content:center;}
  .sheet{background:#fff;border-radius:14px 14px 0 0;padding:16px;width:100%;max-width:560px;
    max-height:88vh;overflow-y:auto;}
  .modal-actions{display:flex;gap:8px;margin-top:14px;}
  .modal-actions .btn{flex:1;}
  .x-close{background:none;border:none;font-size:20px;color:var(--sub);cursor:pointer;padding:4px 8px;}
  .fullscreen{position:fixed;inset:0;background:var(--bg);z-index:35;overflow-y:auto;}
  .fs-header{position:sticky;top:0;background:var(--accent);color:#fff;padding:12px 14px;border-bottom:4px solid var(--wagon);
    display:flex;align-items:center;gap:10px;z-index:5;}
  .fs-header .back{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:2px 6px;}
  .fs-body{padding:12px;padding-bottom:100px;max-width:560px;margin:0 auto;}
  .empty{text-align:center;padding:30px 10px;color:var(--sub);}
  .ing-row{display:flex;align-items:center;gap:8px;margin-bottom:2px;}
  .ing-row select,.ing-row input{flex:2;}
  .ing-row .lbsw{flex:1;}
  .ing-row .updown{display:flex;flex-direction:column;gap:2px;}
  .updown button{background:#eee;border:none;border-radius:5px;width:26px;height:22px;font-size:11px;}
  .link{color:var(--accent-dark);font-weight:600;font-size:14px;cursor:pointer;background:none;border:none;padding:0;}
  .toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#222;color:#fff;
    padding:10px 18px;border-radius:20px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;}
  .toast.show{opacity:1;}
  .checkbox-row{display:flex;align-items:center;gap:6px;}
  hr{border:none;border-top:1px solid var(--line);margin:12px 0;}
  .hist-date{font-weight:700;font-size:14px;margin:14px 0 6px;color:var(--accent-dark);}
  .small-x{background:none;border:none;color:var(--sub);font-size:16px;cursor:pointer;padding:2px 6px;}
  #homeLogo{max-width:560px;margin:0 auto;padding:10px 12px 0 12px;}
  #homeLogo img{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:2px 4px;}
  #homeLogo[hidden]{display:none;}
</style>
</head>

function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();

/* ---------------- dry matter reference table ---------------- */
// Typical textbook DM% for common feedstuffs -- used only to pre-fill a
// starting point when an ingredient is created. These are generic averages,
// NOT lab results. Correct them (Settings tab) to real numbers whenever you
// have a feed test or known moisture, especially for silage/wet ingredients
// where the difference between a guess and reality is large.
const DM_GUESS_TABLE = [
  [/wet\s*distill|wdgs|wet\s*ddg/i, 35],
  [/distill|ddgs|\bdgs\b/i, 90],
  [/corn\s*silage/i, 35],
  [/silage/i, 35],
  [/grass\s*hay|prairie\s*hay|meadow\s*hay/i, 88],
  [/alfalfa/i, 88],
  [/\bhay\b/i, 88],
  [/straw/i, 90],
  [/\bcorn\b/i, 87],
  [/wheat/i, 88],
  [/oats?/i, 89],
  [/barley/i, 88],
  [/\brye\b/i, 88],
  [/sunflower/i, 92],
  [/soybean\s*meal/i, 89],
  [/soybean\s*hulls?/i, 91],
  [/soybeans?/i, 90],
  [/cottonseed\s*hulls?/i, 90],
  [/gluten\s*feed/i, 90],
  [/mineral/i, 95],
  [/supplement|tub|block/i, 90],
  [/flax/i, 90],
  [/cover\s*crop/i, 30]
];
function guessDmPct(name){
  const n = name||'';
  for(const [re, pct] of DM_GUESS_TABLE){ if(re.test(n)) return pct; }
  return 100;
}

function defaultState(){
  const groundHay = {id: uid(), name:'Ground Hay', dmPct: guessDmPct('Ground Hay')};
  const silage = {id: uid(), name:'Silage', dmPct: guessDmPct('Silage')};
  const ddgs = {id: uid(), name:'DDGS', dmPct: guessDmPct('DDGS')};
  const oats = {id: uid(), name:'Oats', dmPct: guessDmPct('Oats')};
  const corn = {id: uid(), name:'Corn', dmPct: guessDmPct('Corn')};
  const flax = {id: uid(), name:'Flax screenings', dmPct: guessDmPct('Flax screenings')};
  const r1800 = {id: uid(), name:'R1800', dmPct: 90}; // placeholder -- replace with the product's actual DM%
  return {
    version:4,
    settings:{ yellowPct:3, redPct:6, reporterName:'', wagonCapacityLb:0 },
    ingredients:[groundHay, silage, ddgs, oats, corn, flax, r1800],

    }],
    pens: [],
    groups: [],
    ranchSavvy: {herds: [], fetchedAt: null},
    feedCalls:[]
  };
}

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.ingredients) return parsed;
    }
  }catch(e){ console.warn('load failed', e); }
  return defaultState();
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ showToast('Save failed - storage full or blocked'); }
}

/* ---------------- helpers ---------------- */

function fmt(n){ if(n===null||n===undefined||isNaN(n)) return '-'; return round1(n).toLocaleString(); }
function todayStr(){
  const d = new Date();
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function displayDate(dstr){
  const [y,m,d]=dstr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric', year:'numeric'});
}
function ingredientName(id){
  const ing = state.ingredients.find(i=>i.id===id);
  return ing ? ing.name : '(deleted ingredient)';
}
function ingredientDmPct(id){
  const ing = state.ingredients.find(i=>i.id===id);
  return (ing && ing.dmPct!=null) ? ing.dmPct : 100;
}
function rationById(id){ return state.rations.find(r=>r.id===id); }
function groupById(id){ return (state.groups||[]).find(g=>g.id===id); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------------- daily report (local file / mailto -- no hosting, no accounts) ---------------- */
// A day's "report" bundles every load logged that day plus a free-text
// comments box, and leaves this phone two ways: a Save-to-Drive share (or a
// plain file download if the native share sheet isn't available) and an
// emailed draft. Both are manual, deliberate taps -- there's no server to
// silently retry through, so fc.reportDriveAt / fc.reportEmailAt are just a
// local checklist ("did I already do this today"), not a delivery receipt.
// Since multiple phones each keep their own separate local data, whichever
// phone generates the report is the one whose name (Settings tab) appears
// in it -- that's the attribution, no shared backend needed for it.
function reporterName(){
  return (state.settings.reporterName||'').trim() || '(name not set - Settings tab)';
}
function feedCallHasContent(fc){
  return !!(fc && ((fc.loads && fc.loads.length>0)
    || (fc.bales && fc.bales.length>0)
    || (fc.fieldDeliveries && fc.fieldDeliveries.length>0)
    || (fc.saltMineral && fc.saltMineral.length>0)));
}
function pendingReportDates(){
  const today = todayStr();
  return state.feedCalls
    .filter(fc=> fc.date < today && feedCallHasContent(fc) && (!fc.reportDriveAt || !fc.reportEmailAt))
    .map(fc=>fc.date)
    .sort();
}

function buildDailyReportText(fc){
  const lines = [];
  lines.push(`Feed report - ${displayDate(fc.date)}`);
  lines.push(`Logged by: ${reporterName()}`);
  lines.push('');
  fc.loads.forEach((l,i)=>{
    const ration = rationById(l.rationId);
    const rationLabel = l.rationName || (ration ? ration.name : '(ration deleted)');
    const penNames = (l.pens||[]).map(p=>penLabel(p)).join(', ');
    const totalHead = (l.pens||[]).reduce((s,p)=>s+(p.headCount||0),0);
    const pos = splitPosition(fc, l);
    lines.push(`Load ${i+1}${pos?` (wagon load ${pos.n} of ${pos.of})`:''}: ${penNames} - ${totalHead} hd total - ${rationLabel} [${l.status==='done'?'Done':(l.status==='in-progress'?'In Progress':'Pending')}]`);
    (l.entries||[]).forEach(e=>{
      const name = e.ingredientName || ingredientName(e.ingredientId);
      if(e.skipped){
        lines.push(`  ${name}: skipped`);
      } else {
        const actual = e.actualIncremental!=null ? `${fmt(e.actualIncremental)} lb` : 'not entered';
        const varPct = e.variancePct!=null ? ` (${e.variancePct>0?'+':''}${fmt(e.variancePct)}%)` : '';
        lines.push(`  ${name}: target ${fmt(e.targetIncremental)} lb / actual ${actual}${varPct}`);
      }
    });
    lines.push(`  Load total: target ${fmt(l.totalTargetLbs)} lb / actual ${l.totalActualLbs!=null?fmt(l.totalActualLbs):'-'} lb`);
    lines.push('');
  });
  const fds = fc.fieldDeliveries||[];
  fds.forEach((fd,i)=>{
    const t = fdTotals(fd);
    lines.push(`Field delivery ${i+1}: ${fd.groupName} - ${fd.headCount} hd - covers ${fd.daysCovered} day${fd.daysCovered==1?'':'s'}`);
    (fd.lines||[]).forEach(l=>{
      if(l.mode==='count'){
        lines.push(`  ${fdIngName(l)}: ${fmt(l.count)} x ${fmt(l.unitWeight)} lb = ${fmt(fdLineLbs(l))} lb`);
      } else {
        lines.push(`  ${fdIngName(l)}: ${fmt(fdLineLbs(l))} lb (estimated)`);
      }
    });
    lines.push(`  Delivered ${fmt(t.actual)} lb / target ${fmt(t.target)} lb${t.variancePct!==null?` (${t.variancePct>0?'+':''}${fmt(t.variancePct)}%)`:''}`);
    if(t.perHdDay!==null) lines.push(`  = ${fmt(t.perHdDay)} lb/hd/day vs target rate ${fmt(fd.targetRate)}`);
    lines.push('');
  });
  const bls = fc.bales||[];
  bls.forEach((b,i)=>{
    lines.push(`Bales ${i+1}: ${b.herd}${b.headCount!=null?` - ${b.headCount} hd`:''} - ${b.mode==='grazed'?'bale grazing':'hauled to herd'}`);
    (b.lines||[]).forEach(l=> lines.push(`  ${baleLineText(l)}`));
    lines.push(`  Total: ${baleSummary(b)}`);
    const prev = balePrevStretch(b, fc.date);
    if(prev) lines.push(`  Previous bales ${usShort(prev.date)} (${fmt(prev.lbs)} lb) lasted ${prev.days} day${prev.days===1?'':'s'}${prev.perHdDay!==null?` = ${fmt(prev.perHdDay)} lb/hd/day`:''}`);
    if((b.notes||'').trim()) lines.push(`  Note: ${b.notes.trim()}`);
    lines.push('');
  });
  const sms = fc.saltMineral||[];
  sms.forEach((e,i)=>{
    lines.push(`Salt & mineral ${i+1}: ${e.herd}${e.headCount!=null?` - ${e.headCount} hd`:''}`);
    smSummaryParts(e).forEach(p=>lines.push(`  ${p}`));
    if((e.notes||'').trim()) lines.push(`  Note: ${e.notes.trim()}`);
    lines.push('');
  });
  const dayTarget = fc.loads.reduce((s,l)=>s+(l.totalTargetLbs||0),0);
  const anyDayActual = fc.loads.some(l=>l.totalActualLbs!=null);
  const dayActual = fc.loads.reduce((s,l)=> l.totalActualLbs!=null ? s+l.totalActualLbs : s, 0);
  // mixer totals and field-delivery totals stay SEPARATE on purpose: a
  // 4-day bale drop lumped into one day's mixer total would misstate both.
  const mixerLabel = fds.length ? 'Mixer total' : 'Day total';
  if(fc.loads.length){
    lines.push(`${mixerLabel} target: ${fmt(dayTarget)} lb`);
    lines.push(`${mixerLabel} actual: ${anyDayActual?fmt(dayActual):'-'} lb`);
  }
  if(fds.length){
    const fdDelivered = fds.reduce((s,fd)=>s+fdTotals(fd).actual,0);
    lines.push(`Field deliveries total: ${fmt(fdDelivered)} lb delivered (targets judged per delivery over the days each covers)`);
  }
  if(bls.length){
    const n = bls.reduce((s,b)=>s+baleCount(b),0), lb = bls.reduce((s,b)=>s+baleLbs(b),0);
    lines.push(`Bales total: ${fmt(n)} bale${n===1?'':'s'}, ~${fmt(lb)} lb`);
  }
  lines.push('');
  lines.push('--- Comments ---');
  lines.push((fc.comments||'').trim() || '(none)');
  return lines.join('\n');
}

function buildDailyReportCsv(fc){
  const rows = [['Date','Logged By','Load #','Pens','Total Head','Ration','Ingredient','Target lb','Actual lb','Variance lb','Variance %','Skipped']];
  fc.loads.forEach((l,i)=>{
    const ration = rationById(l.rationId);
    const rationName = l.rationName || (ration ? ration.name : '');
    const penNames = (l.pens||[]).map(p=> penShare(p)<1 ? `${p.penName} (${Math.round(penShare(p)*100)}%)` : p.penName).join('; '); // split pen tagged w/ its share, no new columns
    const totalHead = (l.pens||[]).reduce((s,p)=>s+(p.headCount||0),0);
    (l.entries||[]).forEach(e=>{
      rows.push([
        fc.date, reporterName(), i+1, penNames, totalHead, rationName,
        e.ingredientName || ingredientName(e.ingredientId), e.targetIncremental,
        e.actualIncremental??'', e.variance??'', e.variancePct??'', e.skipped?'yes':'no'
      ]);
    });
  });
  // Field deliveries ride in the SAME columns (no schema change to the
  // accumulating daily CSVs): Load # is 'FD1', 'FD2'...; Pens carries the
  // group name; Ration carries the coverage window. Targets only exist at
  // the delivery level (no per-ingredient recipe), so ingredient rows show
  // actual lbs only and a '(delivery total)' row carries target/variance.
  (fc.fieldDeliveries||[]).forEach((fd,i)=>{
    const t = fdTotals(fd);
    const rationCol = `Field delivery - covers ${fd.daysCovered} day${fd.daysCovered==1?'':'s'}`;
    (fd.lines||[]).forEach(l=>{
      rows.push([
        fc.date, reporterName(), 'FD'+(i+1), fd.groupName, fd.headCount, rationCol,
        fdIngName(l), '', fdLineLbs(l), '', '', 'no'
      ]);
    });
    rows.push([
      fc.date, reporterName(), 'FD'+(i+1), fd.groupName, fd.headCount, rationCol,
      '(delivery total)', t.target, t.actual, round1(t.actual-t.target), t.variancePct??'', 'no'
    ]);
  });
  // Salt & mineral: same columns again. Load # 'SM1'...; Pens = herd;
  // Ingredient carries the count/unit as recorded ("Salt - 3 bags") and
  // Actual lb the pounds it works out to, so the monthly billing pass has
  // both the unit count it bills on and a weight.
  baleCsvRows(fc).forEach(r=>rows.push(r));
  smCsvRows(fc).forEach(r=>rows.push(r));
  rows.push([]);
  rows.push(['Comments', (fc.comments||'').trim() || '(none)']);
  return rows.map(r=>r.map(csvEscape).join(',')).join('\n');
}

async function shareReportToDrive(fc){
  const csv = buildDailyReportCsv(fc);
  const filename = `feed-report-${fc.date}.csv`;
  const file = new File([csv], filename, {type:'text/csv'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:`Feed report ${fc.date}`});
      fc.reportDriveAt = new Date().toISOString();
      saveState();
      showToast('Shared - pick Drive to save it there');
      render();
      return;
    }catch(e){
      if(e && e.name==='AbortError') return; // person cancelled the share sheet -- not a failure, don't mark or nag
      // fall through to plain download below
    }
  }
  downloadTextFile(csv, filename, 'text/csv'); // csv is already a fully-formed, escaped string -- write it as-is
  fc.reportDriveAt = new Date().toISOString();
  saveState();
  showToast('Downloaded - upload it to Drive from your Files app');
  render();
}

function emailReport(fc){
  let text = buildDailyReportText(fc);
  const MAX = 1800; // mailto body length is unreliable much past this across mail apps
  if(text.length > MAX) text = text.slice(0, MAX) + '\n\n[report truncated for email -- full detail in the Drive copy]';
  const subject = `Feed report - ${fc.date}`;
  window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;
  fc.reportEmailAt = new Date().toISOString();
  saveState();
  render();
}

/* variance color */
function varianceClass(pct){
  if(pct===null||pct===undefined) return 'v-none';
  const a = Math.abs(pct);
  if(a<=state.settings.yellowPct) return 'v-green';
  if(a<=state.settings.redPct) return 'v-yellow';
  return 'v-red';
}

/* ---------------- Ranch Savvy sync (read-only, cached) ---------------- */
// One-way head-count pull. Pens and Groups can each optionally link to a
// Ranch Savvy herd (rsHerdId); every successful pull pushes the herd's
// live active-animal count into the linked roster entry. Links whose herd
// stops coming back (deactivated / sold out in Ranch Savvy) keep their
// last-known count -- flagged on the roster card, never zeroed. Load math
// needs no special handling: loads already read head counts from the live
// roster at build time.
function ranchSavvyConfigured(){ return !!(RS_URL && RS_ANON_KEY); }
function rsHerds(){ return (state.ranchSavvy && state.ranchSavvy.herds) || []; }
function rsHerdById(id){ return rsHerds().find(h=>h.herd_id===id) || null; }
function rsLinkBroken(entry){
  // only call it broken when we HAVE a successful pull to judge against
  return !!(entry.rsHerdId && state.ranchSavvy && state.ranchSavvy.fetchedAt && !rsHerdById(entry.rsHerdId));
}
function rsFetchedAtLabel(){
  const at = state.ranchSavvy && state.ranchSavvy.fetchedAt;
  if(!at) return 'never';
  const d = new Date(at);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '
       + d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
}
function rsStaleMs(){
  const at = state.ranchSavvy && state.ranchSavvy.fetchedAt;
  if(!at) return Infinity;
  return Date.now() - new Date(at).getTime();
}
async function fetchRanchSavvyHerds(){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 8000);
  try{
    const res = await fetch(RS_URL + '/rest/v1/rpc/get_herd_summary', {
      method: 'POST',
      headers: {
        'apikey': RS_ANON_KEY,
        'Authorization': 'Bearer ' + RS_ANON_KEY,
        'x-feedwagon-key': RS_APP_KEY,
        'Content-Type': 'application/json'
      },
      body: '{}',
      signal: ctrl.signal
    });
    if(!res.ok) return {ok:false, error:'HTTP '+res.status};
    const rows = await res.json();
    if(!Array.isArray(rows)) return {ok:false, error:'unexpected response'};
    const herds = rows.map(r=>({
      herd_id: String(r.herd_id),
      name: String(r.name||''),
      active_count: Number(r.active_count)||0
    }));
    state.ranchSavvy = {herds, fetchedAt: new Date().toISOString()};
    applyRanchSavvyCounts();
    saveState();
    return {ok:true};
  }catch(e){
    return {ok:false, error: (e && e.name==='AbortError') ? 'timed out' : 'network unavailable'};
  }finally{ clearTimeout(timer); }
}
function applyRanchSavvyCounts(){
  state.pens.forEach(p=>{
    if(!p.rsHerdId) return;
    const h = rsHerdById(p.rsHerdId);
    if(h) p.headCount = h.active_count;
  });
  (state.groups||[]).forEach(g=>{
    if(!g.rsHerdId) return;
    const h = rsHerdById(g.rsHerdId);
    if(h) g.headCount = h.active_count;
  });
}
function anyEditorOpen(){
  return !!(openLoadId || openRationId || openPenEditId || openGroupEditId
            || document.getElementById('overlay'));
}
async function refreshRanchSavvy(manual){
  if(!ranchSavvyConfigured()) return;
  const r = await fetchRanchSavvyHerds();
  if(manual){
    showToast(r.ok ? 'Ranch Savvy counts updated'
                   : 'Sync failed ('+r.error+') - using last saved counts');
  }
  // never repaint underneath someone mid-entry; the fresh numbers are
  // saved and show up on the next natural render either way
  if(r.ok && !anyEditorOpen()) render();
}
function rsLinkSelectHtml(selectId, currentRsHerdId){
  const opts = rsHerds().map(h=>
    `<option value="${h.herd_id}" ${h.herd_id===currentRsHerdId?'selected':''}>${escapeHtml(h.name)} (${h.active_count} hd)</option>`
  ).join('');
  const orphan = (currentRsHerdId && !rsHerdById(currentRsHerdId))
    ? `<option value="${escapeHtml(currentRsHerdId)}" selected>(linked herd not in last pull)</option>` : '';
  return `<select id="${selectId}">
    <option value="">Not linked - head count entered by hand</option>
    ${orphan}${opts}
  </select>`;
}

/* ---------------- pen weight / intake projection ---------------- */
// A roster pen (or a load's snapshot of one) carries: anchorWeight (lb/hd
// as of anchorDate), adg (lb/hd/day), and an intake target expressed either
// as %BW (auto-grows with projected weight) or a flat lb DM/hd/day number.
// All numeric reads are defensively coerced with Number() because draft
// objects mid-edit hold raw string values from input fields.
function daysBetween(dateA, dateB){
  const [ay,am,ad] = dateA.split('-').map(Number);
  const [by,bm,bd] = dateB.split('-').map(Number);
  const a = Date.UTC(ay,am-1,ad), b = Date.UTC(by,bm-1,bd);
  return Math.round((b-a)/86400000);
}
function projectedWeight(pen, dateStr){
  const anchorWeight = Number(pen.anchorWeight)||0;
  const adg = Number(pen.adg)||0;
  if(!pen.anchorDate) return round1(anchorWeight);
  const days = daysBetween(pen.anchorDate, dateStr);
  return round1(anchorWeight + adg*days);
}
function targetDMIPerHead(pen, dateStr){
  const intakeValue = Number(pen.intakeValue)||0;
  if(pen.intakeMode==='flatDM') return round1(intakeValue);
  if(pen.intakeMode==='pctBW') return round1(projectedWeight(pen,dateStr) * intakeValue/100);
  return null; // 'rationAsIs' -- no DM targeting, ration's own numbers are used directly
}

/* ---------------- load math ---------------- */
// A "load" is one mixer batch. It can cover more than one pen (combined
// because they share a ration) -- load.pens is an array of pen entries.
// Ration items are now a RECIPE: each ingredient is a % of the total mix,
// as-fed basis (should sum to ~100%, but math below normalizes by whatever
// the percentages actually add up to, so a slightly-off total still works).
// rationWeightedDmFraction() gives the mix's blended DM fraction (0-1),
// derived from each ingredient's % share and its own DM%. For a pen with a
// DM intake target (flat or %BW-of-projected-weight), that blended fraction
// converts the pen's target lb DM/hd/day into a total lb AS-FED/hd/day for
// the whole mix, which is then split across ingredients by their % share.
// A pen using 'rationAsIs' skips DM targeting entirely and instead scales
// off the ration's own referenceTotalAsFed (lb as-fed/hd/day) -- the one
// absolute number a recipe-style ration carries, needed because % alone
// has no scale.
function rationWeightedDmFraction(ration){
  const items = ration ? (ration.items||[]) : [];
  const totalPct = items.reduce((s,it)=>s+(Number(it.pctAsFed)||0),0);
  if(totalPct<=0) return 1;
  let dmWeighted = 0;
  items.forEach(it=>{
    const dmPct = ingredientDmPct(it.ingredientId);
    dmWeighted += (Number(it.pctAsFed)||0) * (dmPct/100);
  });
  return dmWeighted/totalPct;
}
// A pen's slice of its day's call that rides on THIS load. 1 = the whole
// call (normal). Below 1 only when an over-capacity call was split and this
// pen got cut across two wagon loads -- e.g. 0.6 here, 0.4 on the next load.
// headCount always stays the pen's real head count; share carries the cut.
function penShare(p){
  const s = Number(p.share);
  return (s>0 && s<1) ? s : 1;
}
// Total lb as-fed this pen gets from this load (call adjustment and share
// applied). Single source for buildTargets, loadPenBreakdown and splitting.
function penLoadAsFed(p, ration, dateStr){
  const dmFraction = rationWeightedDmFraction(ration);
  const referenceTotalAsFed = ration ? (Number(ration.referenceTotalAsFed)||0) : 0;
  const mult = 1 + ((Number(p.adjustPct)||0)/100);
  let full;
  if(!p.intakeMode || p.intakeMode==='rationAsIs'){
    full = referenceTotalAsFed * (Number(p.headCount)||0) * mult;
  } else {
    const dmi = targetDMIPerHead(p, dateStr) * mult;
    const totalAsFedPerHead = dmFraction>0 ? dmi/dmFraction : 0;
    full = totalAsFedPerHead * (Number(p.headCount)||0);
  }
  return full * penShare(p);
}
function buildTargets(load){
  const ration = rationById(load.rationId);
  const items = ration ? (ration.items||[]) : [];
  const totalPct = items.reduce((s,it)=>s+(Number(it.pctAsFed)||0),0);
  const existingByIng = {};
  (load.entries||[]).forEach(e=>existingByIng[e.ingredientId]=e);
  const penTotal = (load.pens||[]).reduce((s,p)=>s+penLoadAsFed(p, ration, load.date),0);
  const newEntries = items.map(it=>{
    const pctFrac = totalPct>0 ? (Number(it.pctAsFed)||0)/totalPct : 0;
    const targetIncremental = round1(penTotal * pctFrac);
    const prior = existingByIng[it.ingredientId] || {};
    return {
      ingredientId: it.ingredientId,
      targetIncremental,
      targetCumulative: 0, // set below in recomputeActuals, which owns the cumulative rebasing
      actualCumulative: prior.actualCumulative ?? null,
      skipped: prior.skipped || false
    };
  });
  load.entries = newEntries;
  recomputeActuals(load);
}

function recomputeActuals(load){
  // basis is wherever the scale actually reads right now -- the last
  // entered actual reading, or the plan's own running total if nothing's
  // been entered yet for this stretch. Each entry's displayed cum target
  // is rebased off THIS, not off the original plan, so if you over- or
  // undershoot one ingredient, every target after it corrects for it.
  let basis = load.startingWeight || 0;
  let totalTarget = 0, totalActual = 0, anyActual=false;
  load.entries.forEach(e=>{
    totalTarget += e.skipped ? 0 : e.targetIncremental;
    if(e.skipped){
      // Nothing added, so the scale target doesn't move -- carry basis through.
      e.targetCumulative = round1(basis);
      e.actualIncremental = 0;
      e.variance = null; e.variancePct = null;
      return;
    }
    e.targetCumulative = round1(basis + e.targetIncremental);
    if(e.actualCumulative===null || e.actualCumulative===undefined || e.actualCumulative===''){
      e.actualIncremental = null; e.variance=null; e.variancePct=null;
      basis = e.targetCumulative; // no actual yet -- coast the plan forward
    } else {
      const ac = Number(e.actualCumulative);
      e.actualIncremental = round1(ac - basis);
      e.variance = round1(e.actualIncremental - e.targetIncremental);
      e.variancePct = e.targetIncremental !== 0
        ? round1((e.variance/e.targetIncremental)*100)
        : (e.actualIncremental !== 0 ? 100 : 0);
      basis = ac; // rebase everything after this off the real reading
      totalActual += e.actualIncremental;
      anyActual = true;
    }
  });
  load.totalTargetLbs = round1(totalTarget);
  load.totalActualLbs = anyActual ? round1(totalActual) : null;
  load.overallVariancePct = (anyActual && totalTarget!==0) ? round1(((totalActual-totalTarget)/totalTarget)*100) : null;
  const allFilled = load.entries.every(e=> e.skipped || (e.actualCumulative!==null && e.actualCumulative!==undefined && e.actualCumulative!==''));
  load.status = allFilled && load.entries.length>0 ? 'done' : (anyActual ? 'in-progress' : 'pending');
}

// Estimated per-pen split of a combined load. We can't know exactly which
// pen got which pounds once ingredients are mixed together, so actuals are
// allocated proportionally to each pen's share of the ration target.
// Every pen in a load eats the same mix, so each pen's fraction of the
// full-ration targets is also its fraction of the skip-adjusted actual mix;
// shares are taken pen-vs-pen (summing to exactly 1) and then scaled by the
// load's real totals, so skipped ingredients shrink every pen's numbers
// proportionally instead of inflating the allocation past the load total.
function loadPenBreakdown(load){
  const ration = rationById(load.rationId);
  const fullTargets = (load.pens||[]).map(p=> penLoadAsFed(p, ration, load.date));
  const fullSum = fullTargets.reduce((s,v)=>s+v,0);
  return (load.pens||[]).map((p,i)=>{
    const share = fullSum>0 ? fullTargets[i]/fullSum : 0;
    const targetTotal = round1((load.totalTargetLbs||0) * share);
    const actualTotal = (load.totalActualLbs!==null && load.totalActualLbs!==undefined) ? round1(load.totalActualLbs*share) : null;
    const variancePct = (actualTotal!==null && targetTotal!==0) ? round1(((actualTotal-targetTotal)/targetTotal)*100) : null;
    const projectedWeightToday = (p.intakeMode==='pctBW') ? projectedWeight(p, load.date) : null;
    const targetDMIToday = (p.intakeMode && p.intakeMode!=='rationAsIs') ? targetDMIPerHead(p, load.date) : null;
    return {...p, targetTotal, actualTotal, variancePct, projectedWeightToday, targetDMIToday};
  });
}

/* ---------------- wagon capacity / splitting a big call ---------------- */
// Settings carry one number: the most lb as-fed the mixer can hold. 0 means
// not set, and the app never warns or splits. When a load's target is over
// it, the load card turns red with a one-tap "Split into N loads" button --
// the crew decides, the app never splits on its own.
//
// Split rule ("whole pens, balanced"): N = fewest loads that fit, each aimed
// at total/N lb so the loads come out roughly even. Pens stay whole and in
// the order they were added (route order). A pen only gets cut across two
// loads when keeping it whole would push a load past ~8% over its even
// share -- then it gets a `share` (e.g. 0.6 on one load, 0.4 on the next).
// If whole-pen packing would leave the last load over capacity, it falls
// back to filling every load to exactly its even share, which always fits.
function wagonCapacity(){ return Number(state.settings.wagonCapacityLb)||0; }
function loadHasActuals(load){
  return (load.entries||[]).some(e=> e.actualCumulative!==null && e.actualCumulative!==undefined && e.actualCumulative!=='');
}
function loadOverCapacity(load){
  const cap = wagonCapacity();
  return cap>0 && (Number(load.totalTargetLbs)||0) > cap + 0.5;
}
function loadsNeededFor(load){
  const cap = wagonCapacity();
  return cap>0 ? Math.max(1, Math.ceil(((Number(load.totalTargetLbs)||0) - 0.5)/cap)) : 1;
}
function penLabel(p){
  const s = penShare(p);
  return `${p.penName} (${p.headCount}${s<1?` hd, ${Math.round(s*100)}% of call`:''})`;
}
// Which load of a split this is, e.g. {n:2, of:3}. null if not part of one.
function splitPosition(fc, load){
  if(!load.splitGroup || !fc) return null;
  const grp = fc.loads.filter(l=>l.splitGroup===load.splitGroup);
  if(grp.length<2) return null;
  return {n: grp.indexOf(load)+1, of: grp.length};
}
function planSplit(load, strict){
  const cap = wagonCapacity();
  const ration = rationById(load.rationId);
  const pens = (load.pens||[]).map(p=>({pen:p, lb:penLoadAsFed(p, ration, load.date)}));
  const total = pens.reduce((s,x)=>s+x.lb,0);
  const n = Math.max(1, Math.ceil((total-0.5)/cap));
  const goal = total/n;
  const wholeCeil = strict ? goal : Math.min(cap, goal*1.08);
  const closeAt = strict ? goal : goal*0.85;
  const out = [[]];
  let cur = 0;
  pens.forEach(({pen, lb})=>{
    let left = lb;
    while(left > 0.5){
      const lastLoad = out.length===n;
      if(lastLoad || cur + left <= wholeCeil + 0.5){
        out[out.length-1].push({pen, lb:left}); cur += left; left = 0;
      } else if(cur >= closeAt && cur>0){
        out.push([]); cur = 0;
      } else {
        const part = goal - cur;
        out[out.length-1].push({pen, lb:part}); left -= part;
        out.push([]); cur = 0;
      }
    }
  });
  const loads = out.filter(g=>g.length>0);
  const tooBig = loads.some(g=> g.reduce((s,x)=>s+x.lb,0) > cap + 0.5);
  if(tooBig && !strict) return planSplit(load, true);
  return loads.map(g=> g.map(({pen, lb})=>{
    const penLb = penLoadAsFed(pen, ration, load.date);
    return {pen, frac: penLb>0 ? lb/penLb : 1};
  }));
}
function splitLoad(loadId){
  const found = findLoad(loadId);
  if(!found) return false;
  const {fc, load} = found;
  if(!loadOverCapacity(load)){ showToast('This load already fits the wagon'); return false; }
  if(loadHasActuals(load)){ showToast('Scale readings already entered -- clear them before splitting'); return false; }
  const plan = planSplit(load, false);
  if(plan.length<2) return false;
  const group = load.splitGroup || uid();
  // shares are rounded to 4 places; each pen's LAST piece takes the
  // remainder so its pieces always add back up to exactly its old share
  const lastPieceIdx = {};
  plan.forEach((g,gi)=> g.forEach(x=>{ lastPieceIdx[x.pen.id] = gi; }));
  const usedShare = {};
  const newLoads = plan.map((g,gi)=>{
    const pens = g.map(({pen, frac})=>{
      const s0 = penShare(pen);
      let s = Math.round(s0*frac*10000)/10000;
      if(lastPieceIdx[pen.id]===gi) s = Math.round((s0 - (usedShare[pen.id]||0))*10000)/10000;
      usedShare[pen.id] = (usedShare[pen.id]||0) + s;
      const piece = {...pen, id: uid()};
      if(s < 0.9999) piece.share = s; else delete piece.share;
      return piece;
    });
    const nl = {id:uid(), date:load.date, rationId:load.rationId,
      startingWeight: gi===0 ? load.startingWeight : 0,
      pens, entries:[], status:'pending', splitGroup: group};
    buildTargets(nl);
    return nl;
  });
  const idx = fc.loads.indexOf(load);
  fc.loads.splice(idx, 1, ...newLoads);
  saveState();
  showToast(`Split into ${newLoads.length} loads`);
  return true;
}
// For "Copy to Today" off a day that was split: rejoin the pieces into one
// load (each pen once, full call) so today's call is figured fresh and gets
// re-split against today's numbers if it's still too big.
function mergeSplitGroup(loads){
  const seen = {}, pens = [];
  loads.forEach(l=> (l.pens||[]).forEach(p=>{
    const key = p.rosterId || ('name:'+p.penName);
    if(seen[key]) return;
    seen[key] = true;
    const c = {...p}; delete c.share;
    pens.push(c);
  }));
  return {...loads[0], pens};
}
function capacityWarningHtml(load, btnAttr){
  if(!loadOverCapacity(load)) return '';
  const n = loadsNeededFor(load);
  const canSplit = !loadHasActuals(load);
  return `
  <div style="margin-top:8px;padding:8px;border:2px solid var(--accent);border-radius:8px;background:#fdecec">
    <div><b>Over wagon capacity:</b> ${fmt(load.totalTargetLbs)} lb call vs ${fmt(wagonCapacity())} lb wagon</div>
    ${canSplit
      ? `<button class="btn block" style="margin-top:6px" ${btnAttr}="${load.id}">Split into ${n} loads</button>`
      : `<div class="muted" style="margin-top:4px">Scale readings already entered, so it can't be split now.</div>`}
  </div>`;
}

/* ---------------- field delivery math ---------------- */
// Feed that never goes through the mixer wagon: bale grazing, filling an
// unmetered supplement feeder on stalks. One Group per entry. daysCovered
// is typed in ON PURPOSE, never inferred -- a bale drop meant to last 4
// days has to be judged against 4 days' worth of target, and delivery
// timing alone can't tell you that. Each ingredient line is independently
// either count x estimated unit weight (3 bales x 1250 lb) or a straight
// lb estimate. Everything here is AS-FED -- that's the basis a bale weight
// or estimate is in; DM shows as info only. Group snapshots (name / head
// count / target rate) are frozen onto the entry at save time so history
// stays intact if the group is later edited or deleted, same as loads do
// with pens and rations.
function fdLineLbs(line){
  if(line.mode==='count') return round1((Number(line.count)||0) * (Number(line.unitWeight)||0));
  return round1(Number(line.lbs)||0);
}
function fdTotals(fd){
  const actual = round1((fd.lines||[]).reduce((s,l)=>s+fdLineLbs(l),0));
  const days = Number(fd.daysCovered)||1;
  const target = round1((fd.headCount||0) * (Number(fd.targetRate)||0) * days);
  const variancePct = target>0 ? round1(((actual-target)/target)*100) : null;
  const perHdDay = (fd.headCount>0 && days>0) ? round1(actual/fd.headCount/days) : null;
  let dmActual = 0;
  (fd.lines||[]).forEach(l=>{ dmActual += fdLineLbs(l) * (ingredientDmPct(l.ingredientId)/100); });
  return {actual, target, variancePct, perHdDay, dmActual: round1(dmActual)};
}
function fdIngName(line){ return line.ingredientName || ingredientName(line.ingredientId); }

/* ---------------- bales ---------------- */
// An entry (fc.bales[]):
// {id, date, herd, rsHerdId, headCount, mode:'hauled'|'grazed',
//  lines:[{kind:'bale', type, count, unitLb} | {kind:'other', name, lbs}],
//  notes, createdAt}
// No "days covered" -- how long bales last falls out of the gap to the
// herd's NEXT bale entry. So each new entry closes out the previous one:
// previous lb / head / days between = realized lb/hd/day. As-fed bales
// consumed (waste included), which is the number that matters for
// planning hay. Computed from THIS phone's entries only.
function baleLineLbs(l){
  if(l.kind==='other') return round1(Number(l.lbs)||0);
  return round1((Number(l.count)||0)*(Number(l.unitLb)||0));
}
function baleLineText(l){
  if(l.kind==='other') return `${l.name||'Other feed'}: ${fmt(baleLineLbs(l))} lb`;
  const c = Number(l.count)||0;
  return `${l.type}: ${fmt(c)} bale${c===1?'':'s'} x ${fmt(l.unitLb)} lb = ${fmt(baleLineLbs(l))} lb`;
}
function baleCount(b){ return (b.lines||[]).reduce((s,l)=> s+(l.kind==='bale'?(Number(l.count)||0):0),0); }
function baleLbs(b){ return round1((b.lines||[]).reduce((s,l)=>s+baleLineLbs(l),0)); }
function baleSummary(b){
  const n = baleCount(b);
  return `${n?`${fmt(n)} bale${n===1?'':'s'}, `:''}~${fmt(baleLbs(b))} lb`;
}
function baleTypeDef(label){ return BALE_TYPES.find(t=>t.label===label) || null; }
function usShort(dstr){ const [y,m,d]=dstr.split('-').map(Number); return `${m}/${d}`; }
function baleAllEntries(){
  const out = [];
  state.feedCalls.forEach(fc=> (fc.bales||[]).forEach(b=> out.push({fc, b, date: b.date||fc.date})));
  return out;
}
function sameHerd(a, b){ return a.rsHerdId ? a.rsHerdId===b.rsHerdId : (!b.rsHerdId && a.herd===b.herd); }
// The herd's most recent bale DAY before `beforeDate` (all entries that day
// summed), and how it worked out over the days until `beforeDate`.
function balePrevStretch(herdRef, beforeDate, excludeId){
  const hits = baleAllEntries().filter(x=> x.b.id!==excludeId && x.date<beforeDate && sameHerd(herdRef, x.b));
  if(!hits.length) return null;
  const lastDate = hits.map(x=>x.date).sort().pop();
  const day = hits.filter(x=>x.date===lastDate);
  const lbs = round1(day.reduce((s,x)=>s+baleLbs(x.b),0));
  const bales = day.reduce((s,x)=>s+baleCount(x.b),0);
  const head = day.map(x=>x.b.headCount).find(h=>h!=null);
  const days = daysBetween(lastDate, beforeDate);
  const perHdDay = (head>0 && days>0) ? round1(lbs/head/days) : null;
  return {date:lastDate, lbs, bales, days, head: head??null, perHdDay};
}
function baleCsvRows(fc){
  const rows = [];
  (fc.bales||[]).forEach((b,i)=>{
    const base = [fc.date, reporterName(), 'BL'+(i+1), b.herd, b.headCount??'', b.mode==='grazed'?'Bale grazing':'Bales hauled'];
    (b.lines||[]).forEach(l=>{
      const label = l.kind==='other' ? (l.name||'Other feed') : `${l.type} - ${Number(l.count)||0} bales @ ${l.unitLb} lb`;
      rows.push([...base, label, '', baleLineLbs(l), '', '', 'no']);
    });
    if((b.notes||'').trim()) rows.push([...base, `Note: ${b.notes.trim()}`, '', '', '', '', 'no']);
  });
  return rows;
}

/* ---------------- salt & mineral ---------------- */
// An entry (fc.saltMineral[]):
// {id, date, herd, rsHerdId, headCount, saltBags, mineralType,
//  mineralAmount, mineralUnit, notes, createdAt}
// headCount is a snapshot from Ranch Savvy on the delivery day. No targets,
// no prices -- it's a delivery record; billing happens off the reports.
function smMineralDef(label){ return SM_MINERAL_TYPES.find(t=>t.label===label) || null; }
function smMineralShort(label){ return (label||'').replace(/\s*\*{3}.*?\*{3}\s*/g,'').trim(); }
function smMineralLbs(e){
  if(!e.mineralType) return null;
  const amt = Number(e.mineralAmount)||0;
  if(e.mineralUnit==='pounds') return round1(amt);
  const def = smMineralDef(e.mineralType);
  if(def && (e.mineralUnit==='bags' || e.mineralUnit==='tubs')) return round1(amt*def.lb);
  return null;
}
function smSummaryParts(e){
  const parts = [];
  const salt = Number(e.saltBags)||0;
  if(salt>0) parts.push(`Salt: ${salt} bag${salt===1?'':'s'} (${fmt(salt*SALT_BAG_LB)} lb)`);
  if(e.mineralType){
    const lbs = smMineralLbs(e);
    parts.push(`${smMineralShort(e.mineralType)}: ${fmt(Number(e.mineralAmount)||0)} ${e.mineralUnit||''}${lbs!==null?` (${fmt(lbs)} lb)`:''}`);
  }
  return parts;
}
function smCsvRows(fc){
  const rows = [];
  (fc.saltMineral||[]).forEach((e,i)=>{
    const base = [fc.date, reporterName(), 'SM'+(i+1), e.herd, e.headCount??'', 'Salt & mineral'];
    const salt = Number(e.saltBags)||0;
    if(salt>0) rows.push([...base, `Salt - ${salt} bag${salt===1?'':'s'}`, '', salt*SALT_BAG_LB, '', '', 'no']);
    if(e.mineralType){
      const lbs = smMineralLbs(e);
      rows.push([...base, `${e.mineralType} - ${Number(e.mineralAmount)||0} ${e.mineralUnit||''}`.trim(), '', lbs??'', '', '', 'no']);
    }
    if((e.notes||'').trim()) rows.push([...base, `Note: ${e.notes.trim()}`, '', '', '', '', 'no']);
  });
  return rows;
}
function smAllEntries(){
  const out = [];
  state.feedCalls.forEach(fc=> (fc.saltMineral||[]).forEach(e=> out.push({fc, e})));
  return out;
}
// Herd choices come from the Ranch Savvy pull (same cached list Pens and
// Groups link to), each carrying its live active-animal count. Before the
// first successful pull -- or with Ranch Savvy turned off -- a default
// herd list stands in so the crew is never blocked. "Other" is always there.
function smHerdOptions(){
  const rs = rsHerds();
  if(ranchSavvyConfigured() && rs.length){
    return rs.map(h=>({key:'rs:'+h.herd_id, name:h.name, rsHerdId:h.herd_id, headCount:h.active_count,
      label:`${h.name} (${h.active_count} hd)`}));
  }
  return SM_HERDS.map(n=>({key:'form:'+n, name:n, rsHerdId:null, headCount:null, label:n}));
}
function smHerdSource(){ return (ranchSavvyConfigured() && rsHerds().length) ? 'rs' : 'form'; }
// most recent entry for a herd on THIS phone (other phones keep their own data);
// matched by Ranch Savvy herd id when there is one, so a renamed herd still lines up
function smLastForHerd(herd, rsHerdId, excludeId){
  const hits = smAllEntries().filter(x=> x.e.id!==excludeId &&
    (rsHerdId ? x.e.rsHerdId===rsHerdId : (!x.e.rsHerdId && x.e.herd===herd)));
  if(!hits.length) return null;
  hits.sort((a,b)=> (b.e.date||b.fc.date).localeCompare(a.e.date||a.fc.date) || String(b.e.createdAt).localeCompare(String(a.e.createdAt)));
  return hits[0].e;
}

let currentTab = 'today';

let lastKnownToday = todayStr();
let openLoadId = null; // when set, load-entry fullscreen is showing
let openRationId = null; // when set, ration editor fullscreen is showing ('new' for new)
let openPenEditId = null; // when set, pen roster editor fullscreen is showing ('new' for new)
let openGroupEditId = null; // when set, group editor fullscreen is showing ('new' for new)
let historyFilter = '';
let showArchivedPens = false;
let showArchivedGroups = false;

// Android keeps installed web apps suspended in memory for days. Without
// this, an app resumed the next morning still treats yesterday as "today":
// new loads get logged under the wrong date and the pending-report banner
// never appears. On return to foreground, if the calendar day has rolled
// over, snap the Today view forward -- but never while an editor is open
// mid-entry (a load being entered at 11:58pm correctly belongs to the day
// it was started).
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState!=='visible') return;
  // Android rarely cold-loads an installed web app, so "return to
  // foreground" is this app's real "app open". A stale Ranch Savvy cache
  // gets refreshed quietly in the background here (guarded inside against
  // repainting over an open editor).
  if(ranchSavvyConfigured() && rsStaleMs() > 6*3600000) refreshRanchSavvy(false);
  const now = todayStr();
  if(now===lastKnownToday) return;
  const wasViewingToday = currentDate===lastKnownToday;
  lastKnownToday = now;
  if(openLoadId||openRationId||openPenEditId||openGroupEditId) return;
  if(wasViewingToday || currentTab==='today'){ currentDate = now; }
  render();
});

// Banner greets you each new day and gets out of the way on the first
// button tap (any button, tabs included). It stays gone the rest of that
// day and comes back the next morning. In-memory only: a full reload
// shows it again, which is harmless.
let bannerDismissedOn = null;
document.addEventListener('click', e=>{
  if(!e.target.closest || !e.target.closest('button')) return;
  if(bannerDismissedOn===todayStr()) return;
  bannerDismissedOn = todayStr();
  const el = document.getElementById('homeLogo');
  if(el) el.hidden = true;
}, true);

function setTab(t){ currentTab=t; openLoadId=null; openRationId=null; openPenEditId=null; openGroupEditId=null; render(); }

document.querySelectorAll('.tabbar button').forEach(b=>{
  b.addEventListener('click', ()=> setTab(b.dataset.tab));
});

function render(){
  document.querySelectorAll('.tabbar button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab===currentTab);
  });
  const app = document.getElementById('app');
  // logo banner lives outside #app so the image isn't re-decoded on every
  // render -- shown on the Today tab only, never inside an editor, and gone
  // for the rest of the day after the first button tap
  document.getElementById('homeLogo').hidden =
    !(currentTab==='today' && !openLoadId && !openRationId && !openPenEditId && !openGroupEditId
      && bannerDismissedOn!==todayStr());
  if(openLoadId){ app.innerHTML=''; renderLoadEntry(openLoadId); return; }
  if(openRationId){ app.innerHTML=''; renderRationEditor(openRationId); return; }
  if(openPenEditId){ app.innerHTML=''; renderPenEditor(openPenEditId); return; }
  if(openGroupEditId){ app.innerHTML=''; renderGroupEditor(openGroupEditId); return; }
  if(currentTab==='today') app.innerHTML = renderToday();
  else if(currentTab==='pens') app.innerHTML = renderPens();
  else if(currentTab==='rations') app.innerHTML = renderRations();
  else if(currentTab==='history') app.innerHTML = renderHistory();
  else if(currentTab==='settings') app.innerHTML = renderSettings();
  wireTabEvents();
}

// Rows for the "Repeat from <day>" card: a call that was split into several
// wagon loads shows as ONE row and copies over as one rejoined load.
function repeatRows(fc){

    rows.push({load: l, group: null, pieces: 1});
  });
  return rows;
}
